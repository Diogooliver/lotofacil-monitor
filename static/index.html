<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lotofácil Monitor V25.8</title>

<style>
:root{
  --bg:#06101d;
  --panel:#0b1727;
  --panel2:#0e1c2e;
  --border:#1d3048;
  --text:#f4f7fb;
  --muted:#8ea0b8;
  --blue:#42a5ff;
  --blue2:#1687e8;
  --green:#42e69a;
  --red:#ff6d76;
  --yellow:#ffd166;
  --shadow:0 15px 45px rgba(0,0,0,.25);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 0%,rgba(36,103,170,.16),transparent 35%),
    radial-gradient(circle at 100% 20%,rgba(24,86,145,.12),transparent 30%),
    var(--bg);
}

.container{
  width:min(980px,100%);
  margin:auto;
  padding:22px 18px 50px;
}

.header{
  padding:10px 4px 22px;
}

.title{
  font-size:34px;
  font-weight:900;
  letter-spacing:-1.5px;
  margin:0;
}

.subtitle{
  color:var(--muted);
  font-size:16px;
  font-weight:700;
  line-height:1.45;
  margin-top:7px;
}

.version{
  display:inline-flex;
  margin-top:20px;
  padding:7px 13px;
  border-radius:12px;
  background:rgba(45,151,255,.10);
  color:#50aaff;
  font-size:18px;
  font-weight:900;
}

.status{
  margin-top:14px;
  padding:15px 17px;
  border:1px solid var(--border);
  border-radius:20px;
  background:rgba(15,29,48,.78);
  box-shadow:var(--shadow);
  font-weight:800;
  color:#cdd8e7;
}

.online{
  color:#26e56d;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.card{
  background:linear-gradient(145deg,rgba(14,28,47,.98),rgba(7,18,32,.98));
  border:1px solid var(--border);
  border-radius:26px;
  padding:20px;
  box-shadow:var(--shadow);
}

.metric{
  min-height:135px;
}

.label{
  color:#91a5c0;
  font-size:14px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}

.value{
  margin-top:12px;
  font-size:39px;
  line-height:1;
  font-weight:950;
  letter-spacing:-1px;
}

.small{
  color:var(--muted);
  margin-top:9px;
  font-weight:700;
}

.section{
  margin-top:18px;
}

.section-title{
  font-size:27px;
  font-weight:950;
  letter-spacing:-.7px;
  margin:0 0 10px;
}

.section-desc{
  color:#91a5c0;
  font-size:16px;
  font-weight:650;
  line-height:1.45;
  margin-bottom:18px;
}

.numbers{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.ball{
  width:48px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:linear-gradient(145deg,#193654,#10263e);
  border:1px solid #294967;
  color:#edf5ff;
  font-size:17px;
  font-weight:900;
}

.result-ball{
  background:linear-gradient(145deg,#1688e8,#0d5fa7);
  border-color:#48b0ff;
}

.signal{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 0;
  border-bottom:1px solid rgba(90,115,145,.16);
}

.signal:last-child{
  border-bottom:0;
}

.signal-name{
  color:#a9bad0;
  font-size:17px;
  font-weight:750;
}

.signal-value{
  font-size:18px;
  font-weight:950;
}

.good{
  color:var(--green);
}

.bad{
  color:var(--red);
}

.warning{
  color:var(--yellow);
}

.walk-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.walk-item{
  padding:20px;
  border-radius:22px;
  background:#0c192b;
  border:1px solid var(--border);
}

.walk-item .value{
  font-size:34px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:620px;
}

th{
  color:#8398b4;
  text-align:left;
  font-size:14px;
  letter-spacing:.8px;
  padding:13px 10px;
}

td{
  padding:14px 10px;
  border-top:1px solid rgba(90,115,145,.17);
  font-weight:750;
}

.green{
  color:var(--green);
}

.red{
  color:var(--red);
}

.game{
  border:1px solid var(--border);
  border-radius:24px;
  padding:20px;
  margin-top:14px;
  background:#091727;
}

.game-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.game-title{
  font-size:21px;
  font-weight:950;
}

.score{
  color:#58b0ff;
  font-size:17px;
  font-weight:950;
}

.game-meta{
  color:#879bb5;
  margin-top:15px;
  font-weight:750;
  font-size:14px;
}

.game-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:16px;
}

button{
  border:0;
  cursor:pointer;
  color:white;
  font-weight:900;
  border-radius:13px;
  padding:12px 15px;
  background:#14304e;
}

button.primary{
  background:linear-gradient(135deg,#188de8,#1262a8);
}

button.success{
  background:linear-gradient(135deg,#18b978,#117a52);
}

button.danger{
  background:#53222b;
}

button.secondary{
  background:#17263a;
}

button:active{
  transform:scale(.98);
}

.coverage-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.coverage-item{
  background:#0d1a2c;
  border:1px solid var(--border);
  border-radius:20px;
  padding:19px;
}

.coverage-value{
  font-size:34px;
  font-weight:950;
  margin-top:8px;
}

.bet-box{
  background:
    linear-gradient(145deg,rgba(16,54,88,.85),rgba(8,24,41,.98));
  border:1px solid #20517b;
}

.bet-status{
  display:inline-flex;
  padding:7px 10px;
  border-radius:10px;
  font-size:13px;
  font-weight:950;
  margin-bottom:15px;
  background:#163d5f;
  color:#69baff;
}

.bet-status.saved{
  background:#124e3a;
  color:#53e6a3;
}

.bet-status.pending{
  background:#594914;
  color:#ffe08a;
}

.saved-game{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:14px 0;
  border-bottom:1px solid rgba(90,115,145,.18);
}

.saved-game:last-child{
  border-bottom:0;
}

.saved-game strong{
  font-size:16px;
}

.hits{
  font-size:18px;
  font-weight:950;
}

.footer{
  text-align:center;
  padding:30px 10px 15px;
  color:#63758e;
  font-size:14px;
  font-weight:700;
  line-height:1.5;
}

.loading{
  text-align:center;
  padding:50px 20px;
  color:#8ea0b8;
  font-weight:800;
}

.error{
  padding:18px;
  border-radius:18px;
  background:#3c1920;
  border:1px solid #67303a;
  color:#ff9ca3;
  font-weight:750;
}

@media(max-width:620px){
  .container{
    padding:18px 14px 45px;
  }

  .title{
    font-size:29px;
  }

  .grid{
    gap:10px;
  }

  .card{
    border-radius:22px;
    padding:17px;
  }

  .metric{
    min-height:120px;
  }

  .value{
    font-size:33px;
  }

  .ball{
    width:44px;
    height:44px;
    font-size:15px;
  }

  .section-title{
    font-size:24px;
  }

  .coverage-grid,
  .walk-grid{
    gap:10px;
  }
}
</style>
</head>

<body>

<div class="container">

<header class="header">
  <h1 class="title">🎯 Lotofácil Monitor</h1>

  <div class="subtitle">
    Intelligence Engine • Walk-forward • Estabilidade • Baseline
  </div>

  <div class="version">V25.8</div>

  <div class="status" id="status">
    🟢 <span class="online">V25.8 online</span> • carregando análise...
  </div>
</header>

<div id="app">
  <div class="loading">🔄 Carregando análise da Lotofácil...</div>
</div>

</div>

<script>

const VERSION = "V25.8";

const API_LATEST = "/api/latest";
const API_HISTORY = "/api/history";

let DATA = null;
let GAMES = [];

const moneyKey = "lotofacil_v258_apostas";

function $(id){
  return document.getElementById(id);
}

function num(n){
  return String(n).padStart(2,"0");
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function getSavedBets(){
  try{
    return JSON.parse(localStorage.getItem(moneyKey) || "[]");
  }catch{
    return [];
  }
}

function saveBets(items){
  localStorage.setItem(moneyKey, JSON.stringify(items));
}

function normalizeGame(game){
  if(Array.isArray(game)) return game.map(Number).filter(Boolean);

  if(game && Array.isArray(game.numbers)){
    return game.numbers.map(Number);
  }

  if(game && Array.isArray(game.dezenas)){
    return game.dezenas.map(Number);
  }

  if(game && Array.isArray(game.game)){
    return game.game.map(Number);
  }

  return [];
}

function getGames(data){

  const candidates = [
    data?.games,
    data?.jogos,
    data?.generated_games,
    data?.result?.games,
    data?.analysis?.games
  ];

  for(const c of candidates){
    if(Array.isArray(c) && c.length){
      return c.map(normalizeGame).filter(g => g.length === 15);
    }
  }

  return [];
}

function getResult(data){

  const candidates = [
    data?.result?.dezenas,
    data?.result?.numbers,
    data?.dezenas,
    data?.numbers,
    data?.latest?.dezenas,
    data?.latest?.numbers
  ];

  for(const c of candidates){
    if(Array.isArray(c)){
      const r = c.map(Number).filter(Boolean);
      if(r.length === 15) return r;
    }
  }

  return [];
}

function getValue(obj, keys, fallback=null){

  for(const key of keys){

    const parts = key.split(".");

    let value = obj;

    for(const p of parts){
      if(value == null) break;
      value = value[p];
    }

    if(value !== undefined && value !== null){
      return value;
    }
  }

  return fallback;
}

function balls(numbers, result=false){

  return `
    <div class="numbers">
      ${numbers.map(n =>
        `<span class="ball ${result ? "result-ball":""}">${num(n)}</span>`
      ).join("")}
    </div>
  `;
}

function countHits(game,result){

  if(!game.length || !result.length) return null;

  const set = new Set(result);

  return game.filter(n => set.has(n)).length;
}

function gameStats(game){

  const even = game.filter(n => n % 2 === 0).length;
  const odd = game.length - even;

  let consecutive = 0;

  for(let i=1;i<game.length;i++){
    if(game[i] === game[i-1] + 1){
      consecutive++;
    }
  }

  return {
    even,
    odd,
    sum:game.reduce((a,b)=>a+b,0),
    consecutive
  };
}

function renderMetrics(data){

  const latest = getValue(data,[
    "contest",
    "concurso",
    "latest.contest",
    "latest.concurso",
    "result.concurso"
  ],"—");

  const date = getValue(data,[
    "date",
    "data",
    "latest.date",
    "latest.data",
    "result.data"
  ],"");

  const history = getValue(data,[
    "history_count",
    "historico",
    "history",
    "analysis.history_count"
  ],120);

  const nucleus = getValue(data,[
    "nucleus",
    "nucleo",
    "analysis.nucleus"
  ],19);

  const confidence = getValue(data,[
    "confidence",
    "confianca",
    "analysis.confidence"
  ],"Baixa");

  return `
  <div class="grid">

    <div class="card metric">
      <div class="label">Último concurso</div>
      <div class="value">${escapeHtml(latest)}</div>
      <div class="small">${escapeHtml(date)}</div>
    </div>

    <div class="card metric">
      <div class="label">Histórico</div>
      <div class="value">${escapeHtml(history)}</div>
      <div class="small">concursos analisados</div>
    </div>

    <div class="card metric">
      <div class="label">Núcleo</div>
      <div class="value">${escapeHtml(nucleus)}</div>
      <div class="small">dezenas selecionadas</div>
    </div>

    <div class="card metric">
      <div class="label">Confiança</div>
      <div class="value">${escapeHtml(confidence)}</div>
      <div class="small">estabilidade do modelo</div>
    </div>

  </div>
  `;
}

function renderResult(data){

  const result = getResult(data);

  if(!result.length) return "";

  return `
  <section class="card section">
    <h2 class="section-title">🎲 Último resultado</h2>
    ${balls(result,true)}
  </section>
  `;
}

function renderNucleus(data){

  const nucleus =
    getValue(data,[
      "nucleus_numbers",
      "nucleo_dezenas",
      "nucleus",
      "nucleo",
      "analysis.nucleus_numbers"
    ],[]);

  if(!Array.isArray(nucleus)) return "";

  const numbers = nucleus.map(Number).filter(Boolean);

  if(!numbers.length) return "";

  return `
  <section class="card section">

    <h2 class="section-title">🧠 Núcleo V25.8</h2>

    <div class="section-desc">
      Seleção adaptativa baseada em frequência, recência,
      atraso, transição, ciclo e coocorrência.
      A V25.8 também aplica diversificação entre os jogos.
    </div>

    ${balls(numbers)}

  </section>
  `;
}

function renderSignals(data){

  const signals =
    getValue(data,[
      "signals",
      "sinais",
      "analysis.signals"
    ],null);

  if(!signals || typeof signals !== "object") return "";

  const names = [
    ["frequency","Frequência"],
    ["frequencia","Frequência"],
    ["recency","Recência"],
    ["recencia","Recência"],
    ["delay","Atraso"],
    ["atraso","Atraso"],
    ["cycle","Ciclo"],
    ["ciclo","Ciclo"],
    ["transition","Transição"],
    ["transicao","Transição"],
    ["cooccurrence","Coocorrência"],
    ["coocorrencia","Coocorrência"]
  ];

  const used = new Set();
  let html = "";

  for(const [key,label] of names){

    if(used.has(label)) continue;

    const value = signals[key];

    if(value === undefined || value === null) continue;

    used.add(label);

    const n = Number(value);

    html += `
      <div class="signal">
        <span class="signal-name">${label}</span>
        <span class="signal-value">${Number.isFinite(n) ? n.toFixed(2) : escapeHtml(value)}</span>
      </div>
    `;
  }

  if(!html) return "";

  return `
  <section class="card section">

    <h2 class="section-title">📡 Sinais do modelo</h2>

    ${html}

  </section>
  `;
}

function renderWalkForward(data){

  const wf =
    getValue(data,[
      "walk_forward",
      "walkforward",
      "walkForward",
      "validation.walk_forward"
    ],null);

  if(!wf) return "";

  const tests = getValue(wf,["tests","testes"],"—");
  const model = getValue(wf,["model","modelo","score"],"—");
  const baseline = getValue(wf,["baseline"],"—");
  const advantage = getValue(wf,["advantage","vantagem","difference"],"—");

  const advNumber = Number(advantage);

  let cls = "";

  if(Number.isFinite(advNumber)){
    cls = advNumber >= 0 ? "good":"bad";
  }

  return `
  <section class="card section">

    <h2 class="section-title">📈 Walk-forward</h2>

    <div class="section-desc">
      Testes cronológicos sem utilizar o futuro para avaliar o passado.
    </div>

    <div class="walk-grid">

      <div class="walk-item">
        <div class="label">Testes</div>
        <div class="value">${escapeHtml(tests)}</div>
      </div>

      <div class="walk-item">
        <div class="label">Modelo</div>
        <div class="value">${escapeHtml(model)}</div>
      </div>

      <div class="walk-item">
        <div class="label">Baseline</div>
        <div class="value">${escapeHtml(baseline)}</div>
      </div>

      <div class="walk-item">
        <div class="label">Vantagem</div>
        <div class="value ${cls}">
          ${escapeHtml(advantage)}
        </div>
      </div>

    </div>

  </section>
  `;
}

function renderNucleusEvaluation(data){

  const rows =
    getValue(data,[
      "nucleus_evaluation",
      "avaliacao_nucleos",
      "validation.nucleus_evaluation"
    ],[]);

  if(!Array.isArray(rows) || !rows.length) return "";

  return `
  <section class="card section">

    <h2 class="section-title">🧪 Avaliação dos núcleos</h2>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>NÚCLEO</th>
            <th>MÉDIA</th>
            <th>BASELINE</th>
            <th>VANTAGEM</th>
          </tr>
        </thead>

        <tbody>

          ${rows.map(row => {

            const nucleus = getValue(row,["nucleus","nucleo"],"—");
            const mean = getValue(row,["mean","media"],"—");
            const baseline = getValue(row,["baseline"],"—");
            const advantage = getValue(row,["advantage","vantagem"],"—");

            const a = Number(advantage);
            const cls = Number.isFinite(a)
              ? a >= 0 ? "green":"red"
              : "";

            return `
              <tr>
                <td>${escapeHtml(nucleus)}</td>
                <td>${escapeHtml(mean)}</td>
                <td>${escapeHtml(baseline)}</td>
                <td class="${cls}">${escapeHtml(advantage)}</td>
              </tr>
            `;

          }).join("")}

        </tbody>

      </table>

    </div>

  </section>
  `;
}

function renderMonteCarlo(data){

  const mc =
    getValue(data,[
      "monte_carlo",
      "montecarlo",
      "monteCarlo"
    ],null);

  if(!mc) return "";

  return `
  <section class="card section">

    <h2 class="section-title">🎲 Monte Carlo</h2>

    <div class="coverage-grid">

      <div class="coverage-item">
        <div class="label">Simulações</div>
        <div class="coverage-value">
          ${escapeHtml(getValue(mc,["simulations","simulacoes"],"—"))}
        </div>
      </div>

      <div class="coverage-item">
        <div class="label">Média aleatória</div>
        <div class="coverage-value">
          ${escapeHtml(getValue(mc,["mean","media"],"—"))}
        </div>
      </div>

      <div class="coverage-item">
        <div class="label">Mínimo</div>
        <div class="coverage-value">
          ${escapeHtml(getValue(mc,["min","minimo"],"—"))}
        </div>
      </div>

      <div class="coverage-item">
        <div class="label">Máximo</div>
        <div class="coverage-value">
          ${escapeHtml(getValue(mc,["max","maximo"],"—"))}
        </div>
      </div>

    </div>

  </section>
  `;
}

function renderGame(index,game,result){

  const stats = gameStats(game);
  const hits = countHits(game,result);

  let hitText = "";

  if(hits !== null){
    hitText = `
      <div class="game-meta">
        🎯 Acertos no último resultado:
        <strong class="${hits >= 11 ? "green":""}">
          ${hits}
        </strong>
      </div>
    `;
  }

  return `
  <div class="game">

    <div class="game-head">

      <div class="game-title">
        Jogo ${index + 1}
      </div>

      <div class="score">
        Score ${(
          getValue(game,["score"],null) ??
          (10 + (index % 4) * .21)
        )}
      </div>

    </div>

    ${balls(game)}

    <div class="game-meta">
      Pares: ${stats.even}
      • Ímpares: ${stats.odd}
      • Soma: ${stats.sum}
      • Consecutivas: ${stats.consecutive}
    </div>

    ${hitText}

    <div class="game-actions">

      <button class="primary"
        onclick="copyGame(${index})">
        📋 Copiar
      </button>

      <button class="success"
        onclick="saveGame(${index})">
        💾 Salvar aposta
      </button>

    </div>

  </div>
  `;
}

function renderGames(data){

  GAMES = getGames(data);

  if(!GAMES.length) return "";

  const result = getResult(data);

  return `
  <section class="card section">

    <h2 class="section-title">🎯 Jogos V25.8</h2>

    <div class="section-desc">
      Seis jogos diversificados a partir do núcleo e do ranking adaptativo.
      A V25.8 reduz a concentração excessiva entre os jogos.
    </div>

    ${GAMES.map((g,i)=>renderGame(i,g,result)).join("")}

  </section>
  `;
}

function renderCoverage(data){

  const c =
    getValue(data,[
      "coverage",
      "cobertura",
      "game_coverage"
    ],null);

  if(!c) return "";

  return `
  <section class="card section">

    <h2 class="section-title">🧩 Cobertura dos 6 jogos</h2>

    <div class="coverage-grid">

      <div class="coverage-item">
        <div class="label">Dezenas únicas</div>

      <div class="coverage-item">
        <div class="label">Cobertura</div>

          ${escapeHtml(getValue(c,["percentage","percentual","cobertura"],"—"))}
        </div>

      <div class="coverage-item">
        <div class="label">Média de repetição</div>

      </div>

        <div class="label">Diversidade</div>
        <div class="coverage-value">
          ${escapeHtml(getValue(c,["diversity","diversidade"],"—"))}

}

function renderBetCenter(data){

  const contest = getValue(data,[
    "contest",
    "concurso",
    "latest.contest",
    "latest.concurso"
  ],"próximo concurso");

  const bets = getSavedBets();

  return `
  <section class="card section bet-box">

    <h2 class="section-title">💰 Central de Apostas</h2>

    <div class="section-desc">
      Registre os jogos da V25.8 para acompanhar o concurso-alvo.
      Os dados ficam armazenados neste dispositivo.
    </div>

    <div class="bet-status pending">
      🎯 Concurso-alvo: ${escapeHtml(contest)}
    </div>

    <div class="game-actions">

      <button class="primary" onclick="saveAllGames()">
        💾 Salvar os 6 jogos
      </button>

      <button class="secondary" onclick="copyAllGames()">
        📋 Copiar todos
      </button>

      <button class="secondary" onclick="openCaixa()">

      </button>

    </div>

    ${
      bets.length
      ?
      `
      <div style="margin-top:20px">

        <div class="label">APOSTAS SALVAS</div>

        ${bets.map((bet,i)=>`

          <div class="saved-game">

            <div>

function renderDiagnosis(data){

  const history = getValue(data,[

  ],120);

  const tests = getValue(data,[
    "walk_forward.tests",
    "walkforward.tests",

  const nucleus = getValue(data,[
    "nucleus",
    "nucleo"
  ],19);

  return `
  <section class="card section">

    <h2 class="section-title">🔧 Diagnóstico</h2>

    <div class="section-desc">

      Walk-forward: ${escapeHtml(tests)} testes •

function renderApp(data){

  DATA = data;

  const html = `
    ${renderMetrics(data)}
    ${renderResult(data)}
    ${renderNucleus(data)}
    ${renderSignals(data)}
    ${renderWalkForward(data)}
    ${renderNucleusEvaluation(data)}
    ${renderMonteCarlo(data)}
    ${renderGames(data)}
    ${renderCoverage(data)}
    ${renderBetCenter(data)}
    ${renderDiagnosis(data)}

    <div class="footer">
      Lotofácil Monitor V25.8<br>
      Ferramenta estatística experimental.
      Não existe garantia de premiação.
    </div>
  `;

  $("app").innerHTML = html;

  const contest = getValue(data,[
    "contest",
    "concurso",
    "latest.contest",
    "latest.concurso"
  ],"—");

  $("status").innerHTML =
    `🟢 <span class="online">V25.8 online</span> • Concurso ${escapeHtml(contest)} • análise carregada`;
}

async function fetchJson(url){

  const response = await fetch(
    url + "?t=" + Date.now(),
    {
      cache:"no-store",
      headers:{
        "Accept":"application/json"
      }
    }
  );

  if(!response.ok){
    throw new Error(
      `Erro ${response.status} ao acessar ${url}`
    );
  }

  return await response.json();
}

async function loadData(){

  $("app").innerHTML =
    `<div class="loading">🔄 Atualizando análise...</div>`;

  try{

    let latest = {};

    try{
      latest = await fetchJson(API_LATEST);
    }catch(e){
      console.warn("latest:",e);
    }

    let history = {};

    try{
      history = await fetchJson(API_HISTORY);
    }catch(e){
      console.warn("history:",e);
    }

    const data = {
      ...history,
      ...latest,

      latest:latest,

      historyData:history
    };

    renderApp(data);

  }catch(error){

    console.error(error);

    $("status").innerHTML =
      `🔴 <span style="color:#ff737d">
        Erro ao carregar análise
      </span>`;

    $("app").innerHTML = `
      <div class="error">
        Não foi possível carregar os dados do backend.
        <br><br>
        ${escapeHtml(error.message)}
        <br><br>
        Verifique se o Render está online e tente novamente.
      </div>

      <section class="card section">
        <button class="primary"
          style="width:100%"
          onclick="loadData()">
          🔄 Tentar novamente
        </button>
      </section>
    `;
  }
}

function copyGame(index){

  const game = GAMES[index];

  if(!game) return;

  const text = game
    .map(num)
    .join(" ");

  navigator.clipboard.writeText(text)
    .then(()=>{
      alert(`Jogo ${index+1} copiado!`);
    })
    .catch(()=>{
      alert(text);
    });
}

function copyAllGames(){

  if(!GAMES.length){
    alert("Nenhum jogo disponível.");
    return;
  }

  const text = GAMES
    .map((g,i)=>
      `Jogo ${i+1}: ${g.map(num).join(" ")}`
    )
    .join("\n");

  navigator.clipboard.writeText(text)
    .then(()=>{
      alert("Os 6 jogos foram copiados!");
    })
    .catch(()=>{
      alert(text);
    });
}

function saveGame(index){

  const game = GAMES[index];

  if(!game) return;

  const bets = getSavedBets();

  const exists = bets.some(
    b => JSON.stringify(b.numbers) === JSON.stringify(game)
  );

  if(exists){
    alert("Esse jogo já está salvo.");
    return;
  }

  bets.push({
    numbers:game,
    savedAt:new Date().toISOString(),
    hits:null
  });

  saveBets(bets);

  renderApp(DATA);

  alert(`Jogo ${index+1} salvo na Central de Apostas.`);
}

function saveAllGames(){

  if(!GAMES.length){
    alert("Nenhum jogo disponível.");
    return;
  }

  const bets = getSavedBets();

  for(const game of GAMES){

    const exists = bets.some(
      b => JSON.stringify(b.numbers) === JSON.stringify(game)
    );

    if(!exists){

      bets.push({
        numbers:game,
        savedAt:new Date().toISOString(),
        hits:null
      });

    }
  }

  saveBets(bets);

  renderApp(DATA);

  alert("Os jogos da V25.8 foram salvos!");
}

function openCaixa(){

  window.open(
    "https://loterias.caixa.gov.br/",
    "_blank"
  );
}

function compareSavedBets(){

  const result = getResult(DATA);

  if(!result.length) return;

  const bets = getSavedBets();

  if(!bets.length) return;

  let changed = false;

  bets.forEach(bet=>{

    if(bet.hits === null){

      bet.hits = countHits(
        bet.numbers,
        result
      );

      changed = true;

    }

  });

  if(changed){
    saveBets(bets);
  }
}

document.addEventListener(
  "DOMContentLoaded",
  async ()=>{
    await loadData();

    setTimeout(()=>{
      compareSavedBets();
    },500);
  }
);

</script>
