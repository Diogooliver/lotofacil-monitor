<script>

/* ============================================================
   LOTOFÁCIL MONITOR — V25.16
   ============================================================ */

const VERSION = "V25.16";

const TOTAL_GAMES = 6;

const GAME_SIZE = 15;

const TOTAL_NUMBERS = 25;

const HISTORY_SIZE = 120;

let history = [];

let latest = null;

let games = [];

let nucleus = null;


/* ============================================================
   UTILIDADES
   ============================================================ */

function sleep(ms){

    return new Promise(
        resolve => setTimeout(resolve,ms)
    );

}


function pad(n){

    return String(n).padStart(2,"0");

}


function sum(arr){

    return arr.reduce(
        (a,b)=>a+b,
        0
    );

}


function unique(arr){

    return [...new Set(arr)];

}


function shuffle(arr){

    const a = [...arr];

    for(
        let i=a.length-1;
        i>0;
        i--
    ){

        const j =
            Math.floor(
                Math.random()*(i+1)
            );

        [
            a[i],
            a[j]
        ]=[
            a[j],
            a[i]
        ];

    }

    return a;

}


/* ============================================================
   NORMALIZAÇÃO DO FRONTEND
   ============================================================ */

function normalizeDraw(item){

    if(!item)
        return null;


    /* --------------------------------------------------------
       OBJETO
       -------------------------------------------------------- */

    if(
        typeof item === "object" &&
        !Array.isArray(item)
    ){

        const concurso =
            Number(
                item.concurso ??
                item.numero ??
                item.numeroConcurso
            );


        let dezenas =
            item.dezenas ??
            item.listaDezenas ??
            item.dezenasSorteadasOrdemSorteio;


        const data =
            item.data ??
            item.dataApuracao ??
            "";


        if(
            !Number.isFinite(concurso) ||
            !Array.isArray(dezenas)
        ){

            return null;

        }


        dezenas =
            dezenas
            .map(Number)
            .filter(
                n =>
                    Number.isInteger(n) &&
                    n>=1 &&
                    n<=25
            );


        dezenas =
            unique(dezenas)
            .sort(
                (a,b)=>a-b
            );


        if(
            dezenas.length !== 15
        ){

            return null;

        }


        return {

            concurso,

            data:String(data),

            dezenas

        };

    }


    /* --------------------------------------------------------
       FORMATO ARRAY:
       [3798,"2026-10-06",[...]]
       -------------------------------------------------------- */

    if(
        Array.isArray(item)
    ){

        if(
            item.length < 3
        ){

            return null;

        }


        const concurso =
            Number(item[0]);


        const data =
            item[1] ?? "";


        let dezenas =
            item[2];


        if(
            !Number.isFinite(concurso) ||
            !Array.isArray(dezenas)
        ){

            return null;

        }


        dezenas =
            dezenas
            .map(Number)
            .filter(
                n =>
                    Number.isInteger(n) &&
                    n>=1 &&
                    n<=25
            );


        dezenas =
            unique(dezenas)
            .sort(
                (a,b)=>a-b
            );


        if(
            dezenas.length !== 15
        ){

            return null;

        }


        return {

            concurso,

            data:String(data),

            dezenas

        };

    }


    return null;

}


function extractHistory(payload){

    /*
        V25.16 aceita:

        payload.resultados
        payload.data
        payload.historico
        payload.concursos
        payload.result
        payload
    */


    let source = null;


    if(
        payload &&
        Array.isArray(
            payload.resultados
        )
    ){

        source =
            payload.resultados;

    }

    else if(
        payload &&
        Array.isArray(
            payload.data
        )
    ){

        source =
            payload.data;

    }

    else if(
        payload &&
        Array.isArray(
            payload.historico
        )
    ){

        source =
            payload.historico;

    }

    else if(
        payload &&
        Array.isArray(
            payload.concursos
        )
    ){

        source =
            payload.concursos;

    }

    else if(
        payload &&
        Array.isArray(
            payload.result
        )
    ){

        source =
            payload.result;

    }

    else if(
        Array.isArray(payload)
    ){

        source =
            payload;

    }


    if(!source){

        return [];

    }


    const normalized =
        source
        .map(normalizeDraw)
        .filter(Boolean);


    const uniqueMap =
        new Map();


    normalized.forEach(draw=>{

        uniqueMap.set(
            draw.concurso,
            draw
        );

    });


    return Array.from(
        uniqueMap.values()
    )
    .sort(
        (a,b)=>
            a.concurso-
            b.concurso
    );

}


/* ============================================================
   FREQUÊNCIA
   ============================================================ */

function frequencyScore(data){

    const counts =
        Array(TOTAL_NUMBERS+1)
        .fill(0);


    data.forEach(draw=>{

        draw.dezenas.forEach(n=>{

            counts[n]++;

        });

    });


    const max =
        Math.max(
            ...counts.slice(1)
        );


    const min =
        Math.min(
            ...counts.slice(1)
        );


    const range =
        Math.max(
            1,
            max-min
        );


    const score={};


    for(
        let n=1;
        n<=25;
        n++
    ){

        score[n] =
            (counts[n]-min)/range;

    }


    return {

        score,

        counts

    };

}


/* ============================================================
   RECÊNCIA
   ============================================================ */

function recencyScore(data){

    const score={};


    for(
        let n=1;
        n<=25;
        n++
    ){

        score[n]=0;

    }


    const recent =
        data.slice(-35);


    recent.forEach(
        (draw,index)=>{

            const weight =
                (index+1)/
                recent.length;


            draw.dezenas.forEach(n=>{

                score[n] += weight;

            });

        }
    );


    const max =
        Math.max(
            ...Object.values(score)
        );


    for(
        let n=1;
        n<=25;
        n++
    ){

        score[n] =
            max
            ? score[n]/max
            : 0;

    }


    return score;

}


/* ============================================================
   ATRASO
   ============================================================ */

function delayScore(data){

    const score={};


    for(
        let n=1;
        n<=25;
        n++
    ){

        let delay=0;


        for(
            let i=data.length-1;
            i>=0;
            i--
        ){

            if(
                data[i].dezenas.includes(n)
            ){

                break;

            }


            delay++;

        }


        score[n]=delay;

    }


    const max =
        Math.max(
            ...Object.values(score)
        );


    const result={};


    for(
        let n=1;
        n<=25;
        n++
    ){

        result[n] =
            max
            ? score[n]/max
            : 0;

    }


    return result;

}


/* ============================================================
   CICLO
   ============================================================ */

function cycleScore(data){

    const result={};


    for(
        let n=1;
        n<=25;
        n++
    ){

        const positions=[];


        for(
            let i=0;
            i<data.length;
            i++
        ){

            if(
                data[i].dezenas.includes(n)
            ){

                positions.push(i);

            }

        }


        if(
            positions.length<2
        ){

            result[n]=0.5;

            continue;

        }


        const gaps=[];


        for(
            let i=1;
            i<positions.length;
            i++
        ){

            gaps.push(
                positions[i]-
                positions[i-1]
            );

        }


        const avg =
            gaps.reduce(
                (a,b)=>a+b,
                0
            )/
            gaps.length;


        const currentGap =
            data.length-1-
            positions[
                positions.length-1
            ];


        const distance =
            Math.abs(
                currentGap-avg
            );


        result[n] =
            1/
            (
                1+
                distance
            );

    }


    return result;

}


/* ============================================================
   COOCORRÊNCIA
   ============================================================ */

function cooccurrenceScore(data){

    const pair =
        Array.from(
            {length:26},
            ()=>Array(26).fill(0)
        );


    data.forEach(draw=>{

        const d =
            draw.dezenas;


        for(
            let i=0;
            i<d.length;
            i++
        ){

            for(
                let j=i+1;
                j<d.length;
                j++
            ){

                pair[d[i]][d[j]]++;

                pair[d[j]][d[i]]++;

            }

        }

    });


    const score={};


    for(
        let n=1;
        n<=25;
        n++
    ){

        const values =
            pair[n].slice(1);


        score[n] =
            values.reduce(
                (a,b)=>a+b,
                0
            );

    }


    const max =
        Math.max(
            ...Object.values(score)
        );


    for(
        let n=1;
        n<=25;
        n++
    ){

        score[n] =
            max
            ? score[n]/max
            : 0;

    }


    return score;

}


/* ============================================================
   SCORE ADAPTATIVO
   ============================================================ */

function calculateRanking(data){

    const f =
        frequencyScore(data);


    const r =
        recencyScore(data);


    const d =
        delayScore(data);


    const c =
        cycleScore(data);


    const co =
        cooccurrenceScore(data);


    const ranking=[];


    for(
        let n=1;
        n<=25;
        n++
    ){

        const score =

            f.score[n] * 0.30 +

            r[n] * 0.20 +

            d[n] * 0.12 +

            c[n] * 0.18 +

            co[n] * 0.20;


        ranking.push({

            n,

            score,

            freq:f.score[n],

            recent:r[n],

            delay:d[n],

            cycle:c[n],

            co:co[n]

        });

    }


    ranking.sort(
        (a,b)=>b.score-a.score
    );


    return ranking;

}


/* ============================================================
   NÚCLEO
   ============================================================ */

function buildNucleus(ranking){

    const strong =
        ranking
        .slice(0,15)
        .map(x=>x.n);


    const protection =
        ranking
        .slice(15,20)
        .map(x=>x.n);


    const rotation =
        ranking
        .slice(20,25)
        .map(x=>x.n);


    return {

        strong,

        protection,

        rotation

    };

}


/* ============================================================
   ESTATÍSTICAS
   ============================================================ */

function gameStats(game){

    const even =
        game.filter(
            n=>n%2===0
        ).length;


    const odd =
        GAME_SIZE-even;


    let consecutive=0;


    for(
        let i=1;
        i<game.length;
        i++
    ){

        if(
            game[i] ===
            game[i-1]+1
        ){

            consecutive++;

        }

    }


    const bands=[

        [1,5],

        [6,10],

        [11,15],

        [16,20],

        [21,25]

    ];


    const distribution =
        bands.map(
            ([a,b])=>
                game.filter(
                    n=>n>=a&&n<=b
                ).length
        );


    return {

        even,

        odd,

        sum:sum(game),

        consecutive,

        distribution

    };

}


/* ============================================================
   SOBREPOSIÇÃO
   ============================================================ */

function overlap(a,b){

    return a.filter(
        n=>b.includes(n)
    ).length;

}


function diversityPenalty(
    candidate,
    existing
){

    if(!existing.length)
        return 0;


    let total=0;


    existing.forEach(g=>{

        total +=
            overlap(
                candidate,
                g
            );

    });


    return total/
        existing.length;

}


/* ============================================================
   CONSTRUTOR
   ============================================================ */

function buildCandidate(
    nucleus,
    ranking,
    mode
){

    const strong =
        [...nucleus.strong];


    const protection =
        [...nucleus.protection];


    const rotation =
        [...nucleus.rotation];


    let candidate=[];


    if(mode===0){

        candidate =
            shuffle(
                strong
            ).slice(0,11);


        candidate.push(
            ...shuffle(
                protection
            ).slice(0,2)
        );


        candidate.push(
            ...shuffle(
                rotation
            ).slice(0,2)
        );

    }

    else if(mode===1){

        candidate =
            shuffle(
                strong
            ).slice(0,9);


        candidate.push(
            ...shuffle(
                protection
            ).slice(0,3)
        );


        candidate.push(
            ...shuffle(
                rotation
            ).slice(0,3)
        );

    }

    else if(mode===2){

        candidate =
            shuffle(
                strong
            ).slice(0,9);


        candidate.push(
            ...shuffle(
                protection
            ).slice(0,2)
        );


        candidate.push(
            ...shuffle(
                rotation
            ).slice(0,4)
        );

    }

    else if(mode===3){

        candidate =
            shuffle(
                strong
            ).slice(0,10);


        candidate.push(
            ...shuffle(
                protection
            ).slice(0,3)
        );


        candidate.push(
            ...shuffle(
                rotation
            ).slice(0,2)
        );

    }

    else if(mode===4){

        candidate =
            shuffle(
                strong
            ).slice(0,8);


        candidate.push(
            ...shuffle(
                protection
            ).slice(0,3)
        );


        candidate.push(
            ...shuffle(
                rotation
            ).slice(0,4)
        );

    }

    else{

        candidate =
            shuffle(
                strong
            ).slice(0,8);


        candidate.push(
            ...shuffle(
                protection
            ).slice(0,4)
        );


        candidate.push(
            ...shuffle(
                rotation
            ).slice(0,3)
        );

    }


    return unique(candidate)
        .sort(
            (a,b)=>a-b
        );

}


/* ============================================================
   MELHORAR JOGO
   ============================================================ */

function improveGame(
    game,
    ranking
){

    let result =
        unique(game);


    const ranked =
        ranking.map(
            x=>x.n
        );


    let attempts=0;


    while(
        result.length<15 &&
        attempts<100
    ){

        const n =
            ranked[
                Math.floor(
                    Math.random()*
                    ranked.length
                )
            ];


        if(
            !result.includes(n)
        ){

            result.push(n);

        }


        attempts++;

    }


    return result
        .sort(
            (a,b)=>a-b
        )
        .slice(
            0,
            15
        );

}


/* ============================================================
   SCORE DO JOGO
   ============================================================ */

function gameScore(
    game,
    ranking
){

    let total=0;


    game.forEach(n=>{

        const item =
            ranking.find(
                x=>x.n===n
            );


        if(item){

            total += item.score;

        }

    });


    return total;

}


/* ============================================================
   GERA JOGOS
   ============================================================ */

function generateGames(
    nucleus,
    ranking
){

    const result=[];


    for(
        let mode=0;
        mode<TOTAL_GAMES;
        mode++
    ){

        let best=null;

        let bestValue=-Infinity;


        for(
            let attempt=0;
            attempt<80;
            attempt++
        ){

            let candidate =
                buildCandidate(
                    nucleus,
                    ranking,
                    mode
                );


            candidate =
                improveGame(
                    candidate,
                    ranking
                );


            const stats =
                gameStats(
                    candidate
                );


            let value =
                gameScore(
                    candidate,
                    ranking
                );


            if(
                stats.even<5 ||
                stats.even>10
            ){

                value -= 0.25;

            }


            if(
                stats.sum<175 ||
                stats.sum>220
            ){

                value -= 0.20;

            }


            if(
                stats.consecutive>9
            ){

                value -= 0.15;

            }


            value -=
                diversityPenalty(
                    candidate,
                    result
                ) * 0.07;


            if(
                value>bestValue
            ){

                bestValue=value;

                best=candidate;

            }

        }


        result.push(best);

    }


    return result;

}


/* ============================================================
   WALK-FORWARD
   ============================================================ */

function walkForward(data){

    const tests=[];


    const start =
        Math.max(
            35,
            data.length-60
        );


    for(
        let i=start;
        i<data.length;
        i++
    ){

        const training =
            data.slice(
                0,
                i
            );


        const actual =
            data[i].dezenas;


        if(
            training.length<30
        ){

            continue;

        }


        const ranking =
            calculateRanking(
                training
            );


        const nucleus =
            buildNucleus(
                ranking
            );


        const generated =
            generateGames(
                nucleus,
                ranking
            );


        let best=0;


        generated.forEach(game=>{

            const hits =
                overlap(
                    game,
                    actual
                );


            best =
                Math.max(
                    best,
                    hits
                );

        });


        tests.push({

            concurso:
                data[i].concurso,

            best

        });

    }


    if(!tests.length){

        return {

            tests:0,

            model:0,

            baseline:0,

            advantage:0

        };

    }


    const model =
        tests.reduce(
            (a,b)=>a+b.best,
            0
        )/
        tests.length;


    const baselineResults=[];


    for(
        let i=start;
        i<data.length;
        i++
    ){

        const training =
            data.slice(
                0,
                i
            );


        const actual =
            data[i].dezenas;


        const freq =
            frequencyScore(
                training
            );


        const base =
            Array.from(
                {
                    length:25
                },
                (_,j)=>j+1
            )
            .sort(
                (a,b)=>
                    freq.counts[b]-
                    freq.counts[a]
            )
            .slice(
                0,
                15
            );


        baselineResults.push(
            overlap(
                base,
                actual
            )
        );

    }


    const baseline =
        baselineResults.reduce(
            (a,b)=>a+b,
            0
        )/
        baselineResults.length;


    return {

        tests:tests.length,

        model,

        baseline,

        advantage:
            model-baseline

    };

}


/* ============================================================
   COBERTURA
   ============================================================ */

function coverage(games){

    const all =
        unique(
            games.flat()
        );


    return {

        unique:
            all.length,

        percent:
            Math.round(
                all.length/
                25*100
            )

    };

}


/* ============================================================
   REPETIÇÃO
   ============================================================ */

function repetition(games){

    const values=[];


    for(
        let i=0;
        i<games.length;
        i++
    ){

        for(
            let j=i+1;
            j<games.length;
            j++
        ){

            values.push(
                overlap(
                    games[i],
                    games[j]
                )
            );

        }

    }


    if(!values.length)
        return 0;


    return (
        values.reduce(
            (a,b)=>a+b,
            0
        )/
        values.length
    );

}


/* ============================================================
   DIVERSIDADE
   ============================================================ */

function diversity(games){

    const rep =
        repetition(games);


    return Math.max(
        0,
        Math.min(
            10,
            15-rep
        )
    );

}

function getSaved(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "lotofacil_v25_16"

        ) || [];

    }catch{

        return [];

    }

}


function saveSaved(data){

    localStorage.setItem(
        "lotofacil_v25_16",
        JSON.stringify(data)
    );

}


function saveGame(index){

    if(
        !games[index] ||
        !latest
    ){

        return;

    }


    const saved =
        getSaved();


    saved.push({

        versao:
            VERSION,

        concurso:
            latest.concurso+1,

        jogo:
            index+1,

        dezenas:
            games[index],

        salvoEm:
            new Date().toISOString()

    });


    saveSaved(saved);


    alert(

        `Jogo ${index+1} salvo para o concurso ${latest.concurso+1}.`

    );

}


function saveAll(){

    if(
        !latest ||
        !games.length
    ){

        return;

    }


    const saved =
        getSaved();


    games.forEach(
        (game,index)=>{

            saved.push({

                versao:
                    VERSION,

                concurso:
                    latest.concurso+1,

                jogo:
                    index+1,

                dezenas:
                    game,

                salvoEm:
                    new Date().toISOString()

            });

        }
    );


    saveSaved(saved);


    alert(
        "Os 6 jogos foram salvos."
    );

}


function copyGame(index){

    if(!games[index])
        return;


    const text =
        games[index]
        .map(pad)
        .join(" ");


    if(
        navigator.clipboard &&
        navigator.clipboard.writeText
    ){

        navigator.clipboard
            .writeText(text)
            .then(
                ()=>{

                    alert(
                        `Jogo ${index+1} copiado.`
                    );

                }
            )
            .catch(
                ()=>{

                    prompt(
                        "Copie o jogo:",
                        text
                    );

                }
            );

    }else{

        prompt(
            "Copie o jogo:",
            text
        );

    }

}

/* ============================================================
   CARREGAMENTO DO HISTÓRICO
   ============================================================ */

async function load(){

    const app =
        document.getElementById(
            "app"
        );


    try{

        app.innerHTML = `

            <div class="loading">

                🔄 Conectando ao histórico da Lotofácil...

                <br><br>

                <span class="small">
                    Buscando os últimos ${HISTORY_SIZE}
                    concursos.
                </span>

            </div>

        `;


        /*
            IMPORTANTE:

            O app.py V25.15 retorna:

            {
                status: "ok",
                total: 120,
                resultados: [...]
            }

            A V25.16 passa a ler "resultados".
        */


        const response =
            await fetch(
                `/api/lotofacil/history?limit=${HISTORY_SIZE}`,
                {
                    method:"GET",

                    cache:"no-store",

                    headers:{
                        "Accept":
                            "application/json"
                    }
                }
            );


        if(!response.ok){

            let detail =
                `HTTP ${response.status}`;


            try{

                const errorPayload =
                    await response.json();


                if(
                    errorPayload &&
                    errorPayload.detail
                ){

                    detail =
                        typeof errorPayload.detail === "string"
                        ? errorPayload.detail
                        : JSON.stringify(
                            errorPayload.detail
                        );

                }

            }catch{

                /* mantém HTTP status */

            }


            throw new Error(
                `Falha ao carregar histórico: ${detail}`
            );

        }


        const payload =
            await response.json();


        console.log(
            "Lotofácil Monitor — resposta:",
            payload
        );


        history =
            extractHistory(
                payload
            );


        console.log(
            "Lotofácil Monitor — concursos normalizados:",
            history.length
        );


        if(
            !history.length
        ){

            throw new Error(
                "Histórico vazio após interpretar a resposta da API."
            );

        }


        /*
            Garantia de ordem:
            menor → maior concurso.
        */

        history.sort(
            (a,b)=>
                a.concurso-
                b.concurso
        );


        /*
            Mantém somente os últimos 120,
            mesmo que o backend entregue mais.
        */

        if(
            history.length > HISTORY_SIZE
        ){

            history =
                history.slice(
                    -HISTORY_SIZE
                );

        }


        latest =
            history[
                history.length-1
            ];


        if(
            !latest ||
            !Array.isArray(
                latest.dezenas
            ) ||
            latest.dezenas.length !== 15
        ){

            throw new Error(
                "Último concurso inválido."
            );

        }


        render();


    }catch(error){

        console.error(
            "Lotofácil Monitor:",
            error
        );


        app.innerHTML = `

            <div class="card error-box">

                <div class="error-title">

                    ❌ Erro

                </div>

                <div class="muted">

                    Não foi possível carregar
                    os resultados da Lotofácil.

                    <br><br>

                    ${escapeHtml(
                        error.message
                    )}

                </div>


                <div class="buttons">

                    <button
                        class="btn-blue"
                        onclick="load()"
                    >

                        🔄 Tentar novamente

                    </button>


                    <button
                        class="btn-dark"
                        onclick="location.reload()"
                    >

                        🔃 Recarregar página

                    </button>

                </div>

            </div>

        `;

    }

}


/* ============================================================
   ESCAPE HTML
   ============================================================ */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
