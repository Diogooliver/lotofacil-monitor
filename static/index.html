<div class="container">
<div id="app"><div class="loading">🧠 Carregando Lotofácil Monitor V25.18...</div></div>

<script>
"use strict";

// ============================================================
// CONFIGURAÇÃO V25.18
// ============================================================

const VERSION = "V25.18";
const TOTAL_GAMES = 6;
const GAME_SIZE = 15;
const TOTAL_NUMBERS = 25;
const HISTORY_LIMIT = 120;
const MAX_EXTRA_GAMES = 20;

let history = [];
let latest = null;
let games = [];
let nucleus = null;
let ranking = [];
let generating = false;
let generationMessage = "";
let generationWarning = "";

// ============================================================
// UTILIDADES
// ============================================================

function pad(n){ return String(n).padStart(2,"0"); }
function sum(arr){ return arr.reduce((a,b)=>a+b,0); }
function unique(arr){ return [...new Set(arr)]; }

function shuffle(arr){
 const a=[...arr];
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function clamp(value,min,max){
 return Math.max(min,Math.min(max,value));
}

function gameKey(game){
 return [...game].sort((a,b)=>a-b).join("-");
}

// ============================================================
// FREQUÊNCIA
// ============================================================

function frequencyScore(data){
 const counts=Array(TOTAL_NUMBERS+1).fill(0);

 data.forEach(draw=>{
  draw.dezenas.forEach(n=>{
   if(n>=1&&n<=25) counts[n]++;
  });
 });

 const values=counts.slice(1);
 const max=Math.max(...values);
 const min=Math.min(...values);
 const range=Math.max(1,max-min);
 const score={};

 for(let n=1;n<=25;n++){
  score[n]=(counts[n]-min)/range;
 }

 return {score,counts};
}

// ============================================================
// RECÊNCIA
// ============================================================

function recencyScore(data){
 const score={};
 for(let n=1;n<=25;n++) score[n]=0;

 const recent=data.slice(-40);

 recent.forEach((draw,index)=>{
  const weight=(index+1)/Math.max(1,recent.length);
  draw.dezenas.forEach(n=>{score[n]+=weight;});
 });

 const max=Math.max(...Object.values(score));

 for(let n=1;n<=25;n++){
  score[n]=max?score[n]/max:0;
 }

 return score;
}

// ============================================================
// ATRASO
// ============================================================

function delayScore(data){
 const raw={};

 for(let n=1;n<=25;n++){
  let delay=0;

  for(let i=data.length-1;i>=0;i--){
   if(data[i].dezenas.includes(n)) break;
   delay++;
  }

  raw[n]=delay;
 }

 const max=Math.max(...Object.values(raw));
 const result={};

 for(let n=1;n<=25;n++){
  result[n]=max?raw[n]/max:0;
 }

 return result;
}

// ============================================================
// CICLO
// ============================================================

function cycleScore(data){
 const result={};

 for(let n=1;n<=25;n++){
  const positions=[];

  for(let i=0;i<data.length;i++){
   if(data[i].dezenas.includes(n)) positions.push(i);
  }

  if(positions.length<2){
   result[n]=0.5;
   continue;
  }

  const gaps=[];

  for(let i=1;i<positions.length;i++){
   gaps.push(positions[i]-positions[i-1]);
  }

  const avg=sum(gaps)/gaps.length;
  const currentGap=data.length-1-positions[positions.length-1];
  result[n]=1/(1+Math.abs(currentGap-avg));
 }

 return result;
}

// ============================================================
// COOCORRÊNCIA
// ============================================================

function cooccurrenceScore(data){
 const pair=Array.from({length:26},()=>Array(26).fill(0));

 data.forEach(draw=>{
  const d=draw.dezenas;

  for(let i=0;i<d.length;i++){
   for(let j=i+1;j<d.length;j++){
    pair[d[i]][d[j]]++;
    pair[d[j]][d[i]]++;
   }
  }
 });

 const score={};

 for(let n=1;n<=25;n++){
  score[n]=pair[n].slice(1).reduce((a,b)=>a+b,0);
 }

 const max=Math.max(...Object.values(score));

 for(let n=1;n<=25;n++){
  score[n]=max?score[n]/max:0;
 }

 return score;
}

// ============================================================
// RANKING ADAPTATIVO
// ============================================================

function calculateRanking(data){
 const f=frequencyScore(data);
 const r=recencyScore(data);
 const d=delayScore(data);
 const c=cycleScore(data);
 const co=cooccurrenceScore(data);
 const result=[];

 for(let n=1;n<=25;n++){
  const score=
   f.score[n]*0.28+
   r[n]*0.20+
   d[n]*0.12+
   c[n]*0.18+
   co[n]*0.22;

  result.push({
   n,score,
   freq:f.score[n],
   recent:r[n],
   delay:d[n],
   cycle:c[n],
   co:co[n]
  });
 }

 result.sort((a,b)=>b.score-a.score);
 return result;
}

// ============================================================
// NÚCLEO 15 + 5 + 5
// ============================================================

function buildNucleus(ranking){
 return {
  strong:ranking.slice(0,15).map(x=>x.n),
  protection:ranking.slice(15,20).map(x=>x.n),
  rotation:ranking.slice(20,25).map(x=>x.n)
 };
}

// ============================================================
// ESTATÍSTICAS DOS JOGOS
// ============================================================

function gameStats(game){
 const even=game.filter(n=>n%2===0).length;
 const odd=GAME_SIZE-even;
 let consecutive=0;

 for(let i=1;i<game.length;i++){
  if(game[i]===game[i-1]+1) consecutive++;
 }

 const bands=[[1,5],[6,10],[11,15],[16,20],[21,25]];
 const distribution=bands.map(([a,b])=>
  game.filter(n=>n>=a&&n<=b).length
 );

 return {even,odd,sum:sum(game),consecutive,distribution};
}

function overlap(a,b){
 return a.filter(n=>b.includes(n)).length;
}

function diversityPenalty(candidate,existing){
 if(!existing.length) return 0;

 let total=0;
 existing.forEach(game=>{total+=overlap(candidate,game);});

 return total/existing.length;
}

function bandPenalty(distribution,target){
 let penalty=0;
 for(let i=0;i<5;i++){
  penalty+=Math.abs(distribution[i]-target[i]);
 }
 return penalty;
}

// ============================================================
// PERFIS DOS SEIS JOGOS INICIAIS
// ============================================================

const PROFILES=[
 {name:"Força",strong:11,protection:2,rotation:2,evenMin:6,evenMax:9,sumMin:185,sumMax:215,targetBands:[3,3,3,3,3]},
 {name:"Equilíbrio",strong:10,protection:3,rotation:2,evenMin:6,evenMax:9,sumMin:180,sumMax:220,targetBands:[3,3,3,3,3]},
 {name:"Proteção",strong:9,protection:4,rotation:2,evenMin:6,evenMax:9,sumMin:175,sumMax:220,targetBands:[3,3,3,3,3]},
 {name:"Rotação",strong:9,protection:2,rotation:4,evenMin:5,evenMax:10,sumMin:175,sumMax:225,targetBands:[3,3,3,3,3]},
 {name:"Diversidade",strong:8,protection:3,rotation:4,evenMin:5,evenMax:10,sumMin:170,sumMax:225,targetBands:[3,3,3,3,3]},
 {name:"Cobertura",strong:8,protection:4,rotation:3,evenMin:5,evenMax:10,sumMin:170,sumMax:230,targetBands:[3,3,3,3,3]}
];

// Perfis adicionais alternam as estratégias do núcleo.
const EXTRA_PROFILES=[
 {name:"Extra Força",strong:11,protection:2,rotation:2,evenMin:5,evenMax:10,sumMin:175,sumMax:225,targetBands:[3,3,3,3,3]},
 {name:"Extra Equilíbrio",strong:10,protection:3,rotation:2,evenMin:6,evenMax:9,sumMin:180,sumMax:220,targetBands:[3,3,3,3,3]},
 {name:"Extra Proteção",strong:9,protection:4,rotation:2,evenMin:5,evenMax:10,sumMin:170,sumMax:225,targetBands:[3,3,3,3,3]},
 {name:"Extra Rotação",strong:8,protection:3,rotation:4,evenMin:5,evenMax:10,sumMin:170,sumMax:230,targetBands:[3,3,3,3,3]},
 {name:"Extra Diversidade",strong:8,protection:4,rotation:3,evenMin:5,evenMax:10,sumMin:165,sumMax:230,targetBands:[3,3,3,3,3]}
];

// ============================================================
// CONSTRUTOR DE CANDIDATO
// ============================================================

function buildCandidate(nucleus,profile){
 let candidate=[];

 candidate.push(...shuffle(nucleus.strong).slice(0,profile.strong));
 candidate.push(...shuffle(nucleus.protection).slice(0,profile.protection));
 candidate.push(...shuffle(nucleus.rotation).slice(0,profile.rotation));

 return unique(candidate);
}

function completeCandidate(candidate,ranking){
 const result=unique(candidate);
 const ranked=ranking.map(x=>x.n);
 let attempts=0;

 while(result.length<15&&attempts<500){
  const n=ranked[Math.floor(Math.random()*ranked.length)];
  if(!result.includes(n)) result.push(n);
  attempts++;
 }

 return result.sort((a,b)=>a-b).slice(0,15);
}

// ============================================================
// SCORE E AVALIAÇÃO DO JOGO
// ============================================================

function rawGameScore(game,ranking){
 let total=0;

 game.forEach(n=>{
  const item=ranking.find(x=>x.n===n);
  if(item) total+=item.score;
 });

 return total;
}

function candidateScore(game,ranking,existing,profile){
 const stats=gameStats(game);
 let value=rawGameScore(game,ranking);

 if(stats.even<profile.evenMin) value-=(profile.evenMin-stats.even)*0.20;
 if(stats.even>profile.evenMax) value-=(stats.even-profile.evenMax)*0.20;
 if(stats.sum<profile.sumMin) value-=(profile.sumMin-stats.sum)*0.018;
 if(stats.sum>profile.sumMax) value-=(stats.sum-profile.sumMax)*0.018;
 if(stats.consecutive>10) value-=(stats.consecutive-10)*0.15;

 value-=bandPenalty(stats.distribution,profile.targetBands)*0.08;
 value-=diversityPenalty(game,existing)*0.18;

 return value;
}

function improveCandidate(game,ranking){
 return completeCandidate(game,ranking);
}

// ============================================================
// GERAR UM JOGO OTIMIZADO
// ============================================================

function generateOneGame(nucleus,ranking,existing,profile,forbiddenKeys=new Set()){
 let best=null;
 let bestScore=-Infinity;
 let bestFresh=null;
 let bestFreshScore=-Infinity;

 for(let attempt=0;attempt<500;attempt++){
  let candidate=buildCandidate(nucleus,profile);
  candidate=improveCandidate(candidate,ranking);

  if(candidate.length!==15||new Set(candidate).size!==15) continue;

  const key=gameKey(candidate);
  const value=candidateScore(candidate,ranking,existing,profile);

  if(value>bestScore){
   bestScore=value;
   best=candidate;
  }

  if(!forbiddenKeys.has(key)&&value>bestFreshScore){
   bestFreshScore=value;
   bestFresh=candidate;
  }
 }

 // Prefere uma combinação que ainda não exista.
 return bestFresh||best;
}

// ============================================================
// COBERTURA DOS JOGOS INICIAIS
// ============================================================

function optimizeCoverage(inputGames){
 if(inputGames.length!==6) return inputGames;

 let result=inputGames.map(g=>[...g]);
 let all=unique(result.flat());

 if(all.length>=25) return result;

 const missing=Array.from({length:25},(_,i)=>i+1).filter(n=>!all.includes(n));

 missing.forEach(missingNumber=>{
  let bestGame=-1,bestPosition=-1,bestPenalty=Infinity;

  for(let i=0;i<result.length;i++){
   for(let p=0;p<result[i].length;p++){
    const candidate=[...result[i]];
    candidate[p]=missingNumber;
    candidate.sort((a,b)=>a-b);

    const stats=gameStats(candidate);
    const duplicate=result.filter((_,j)=>j!==i)
     .reduce((total,g)=>total+overlap(candidate,g),0);

    let penalty=duplicate*0.5;

    if(stats.even<5||stats.even>10) penalty+=3;
    if(stats.sum<165||stats.sum>230) penalty+=2;

    if(penalty<bestPenalty){
     bestPenalty=penalty;
     bestGame=i;
     bestPosition=p;
    }
   }
  }

  if(bestGame>=0){
   result[bestGame][bestPosition]=missingNumber;
   result[bestGame].sort((a,b)=>a-b);
  }
 });

 return result;
}

// ============================================================
// GERADOR INICIAL DOS SEIS JOGOS
// ============================================================

function generateGames(nucleus,ranking){
 const result=[];
 const keys=new Set();

 for(let i=0;i<TOTAL_GAMES;i++){
  const game=generateOneGame(nucleus,ranking,result,PROFILES[i],keys);

  if(game){
   result.push(game);
   keys.add(gameKey(game));
  }
 }

 while(result.length<TOTAL_GAMES){
  const profile=PROFILES[result.length];
  const game=generateOneGame(nucleus,ranking,result,profile,keys);

  if(!game||keys.has(gameKey(game))) break;

  result.push(game);
  keys.add(gameKey(game));
 }

 return optimizeCoverage(result);
}

// ============================================================
// NOVO: GERAR DE 1 A 20 JOGOS ADICIONAIS
// ============================================================

function generateMoreGamesFromUI(){
 const selector=document.getElementById("extraGameCount");
 const button=document.getElementById("generateMoreButton");

 if(generating||!selector||!nucleus||!ranking.length) return;

 const requested=Number(selector.value);

 if(!Number.isInteger(requested)||requested<1||requested>MAX_EXTRA_GAMES){
  alert("Escolha uma quantidade entre 1 e 20.");
  return;
 }

 generating=true;
 generationMessage="";
 generationWarning="";

 if(button){
  button.disabled=true;
  button.textContent="⏳ Gerando jogos...";
 }

 // Dá oportunidade à interface de atualizar o botão antes do cálculo.
 setTimeout(()=>{
  try{
   const before=games.length;
   const added=generateAdditionalGames(requested);
   const after=games.length;

   if(added===0){
    generationMessage="";
    generationWarning="Não foi possível encontrar novas combinações diferentes nesta tentativa. Tente novamente.";
   }else{
    generationMessage=`Foram adicionados ${added} novo(s) jogo(s).`;
    if(added<requested){
     generationWarning=`Foram solicitados ${requested} jogos, mas apenas ${added} combinações novas foram encontradas.`;
    }
   }

   generating=false;
   render();

   if(after===before){
    alert(generationWarning||"Nenhum jogo novo foi adicionado.");
   }
  }catch(error){
   generating=false;
   render();
   alert("Erro ao gerar jogos: "+error.message);
  }
 },50);
}

function generateAdditionalGames(quantity){
 const initialCount=games.length;
 const existingKeys=new Set(games.map(gameKey));
 let added=0;

 for(let i=0;i<quantity;i++){
  // Alterna os perfis para não depender de um perfil único.
  const profile=EXTRA_PROFILES[(games.length-TOTAL_GAMES)%EXTRA_PROFILES.length];

  // Recalcula as chaves a cada jogo para impedir duplicatas na mesma rodada.
  const forbiddenKeys=new Set(existingKeys);
  let candidate=generateOneGame(nucleus,ranking,games,profile,forbiddenKeys);

  // Segunda tentativa caso a primeira não tenha encontrado combinação inédita.
  if(candidate&&existingKeys.has(gameKey(candidate))){
   candidate=generateOneGame(nucleus,ranking,games,profile,forbiddenKeys);
  }

  if(!candidate||candidate.length!==15||new Set(candidate).size!==15){
   continue;
  }

  const key=gameKey(candidate);

  if(existingKeys.has(key)){
   continue;
  }

  games.push(candidate);
  existingKeys.add(key);
  added++;
 }

 // Não mexemos nos jogos anteriores; apenas acrescentamos novos.
 return added;
}

// ============================================================
// WALK-FORWARD
// ============================================================

function walkForward(data){
 const tests=[];
 const start=Math.max(35,data.length-60);

 for(let i=start;i<data.length;i++){
  const training=data.slice(0,i);
  const actual=data[i].dezenas;

  if(training.length<30) continue;

  const localRanking=calculateRanking(training);
  const localNucleus=buildNucleus(localRanking);
  const generated=generateGames(localNucleus,localRanking);

  let best=0;

  generated.forEach(game=>{
   best=Math.max(best,overlap(game,actual));
  });

  tests.push({concurso:data[i].concurso,best});
 }

 if(!tests.length){
  return {tests:0,model:0,baseline:0,advantage:0};
 }

 const model=tests.reduce((a,b)=>a+b.best,0)/tests.length;
 const baselineResults=[];

 for(let i=start;i<data.length;i++){
  const training=data.slice(0,i);
  const actual=data[i].dezenas;
  const freq=frequencyScore(training);

  const base=Array.from({length:25},(_,j)=>j+1)
   .sort((a,b)=>freq.counts[b]-freq.counts[a])
   .slice(0,15);

  baselineResults.push(overlap(base,actual));
 }

 const baseline=baselineResults.reduce((a,b)=>a+b,0)/baselineResults.length;

 return {tests:tests.length,model,baseline,advantage:model-baseline};
}

// ============================================================
// MÉTRICAS GERAIS
// ============================================================

function coverage(list){
 const all=unique(list.flat());

 return {
  unique:all.length,
  percent:Math.round(all.length/25*100)
 };
}

function repetition(list){
 const values=[];

 for(let i=0;i<list.length;i++){
  for(let j=i+1;j<list.length;j++){
   values.push(overlap(list[i],list[j]));
  }
 }

 if(!values.length) return 0;

 return values.reduce((a,b)=>a+b,0)/values.length;
}

function diversity(list){
 return clamp(15-repetition(list),0,15);
}

async function copyText(text){
 try{
  if(navigator.clipboard&&window.isSecureContext){
   await navigator.clipboard.writeText(text);
   return true;
  }
 }catch(error){}

 // Fallback para navegadores que não oferecem Clipboard API.
 const area=document.createElement("textarea");
 area.value=text;
 area.style.position="fixed";
 area.style.opacity="0";
 document.body.appendChild(area);
 area.select();

 let success=false;

 try{
  success=document.execCommand("copy");
 }catch(error){}

 area.remove();
 return success;
}

async function copyGame(index){
 if(!games[index]) return;

 const text=games[index].map(pad).join(" ");
 const success=await copyText(text);

 alert(success?`Jogo ${index+1} copiado.`:text);
}

async function copyAll(){

// ============================================================
// CARREGAMENTO DO HISTÓRICO
// ============================================================

async function fetchHistory(){
 const endpoints=[
  "/api/history?limit=120",
  "/api/lotofacil/history?limit=120",
  "/history?limit=120"
 ];

 let lastError=null;

 for(const endpoint of endpoints){
  try{
   const response=await fetch(endpoint,{cache:"no-store"});

   if(!response.ok){
    throw new Error(`HTTP ${response.status} em ${endpoint}`);
   }

   const payload=await response.json();
   let data=[];

   if(Array.isArray(payload.resultados)) data=payload.resultados;
   else if(Array.isArray(payload.data)) data=payload.data;
   else if(Array.isArray(payload.results)) data=payload.results;
   else if(Array.isArray(payload)) data=payload;

   if(!data.length) throw new Error("Histórico vazio.");

   return data;
  }catch(error){
   lastError=error;
  }
 }

 throw lastError||new Error("Não foi possível carregar o histórico.");
}

// ============================================================
// NORMALIZAÇÃO DO HISTÓRICO
// ============================================================

function normalizeHistory(data){
 const normalized=[];

 data.forEach(item=>{
  if(!item||!Array.isArray(item.dezenas)) return;

  const dezenas=unique(
   item.dezenas.map(Number).filter(n=>Number.isInteger(n)&&n>=1&&n<=25)
  );

  if(dezenas.length!==15) return;

  const concurso=Number(item.concurso??item.numero??item.numeroConcurso);

  if(!Number.isFinite(concurso)) return;

  normalized.push({
   concurso,
   data:String(item.data??item.dataApuracao??""),
   dezenas:dezenas.sort((a,b)=>a-b)
  });
 });

 const map=new Map();

 normalized.forEach(item=>map.set(item.concurso,item));

 return Array.from(map.values())
  .sort((a,b)=>a.concurso-b.concurso)
  .slice(-HISTORY_LIMIT);
}

// INICIALIZAÇÃO
// ============================================================

async function load(){
 try{
  const data=await fetchHistory();
  history=normalizeHistory(data);

  if(!history.length){
   throw new Error("Nenhum concurso válido encontrado no histórico.");
  }

  latest=history[history.length-1];
  games=[];
  render();
