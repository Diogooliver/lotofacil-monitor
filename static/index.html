<script>

const VERSION = "V25.17";

const TOTAL_GAMES = 6;

const GAME_SIZE = 15;

const TOTAL_NUMBERS = 25;

const HISTORY_LIMIT = 120;

let history = [];

let latest = null;

let games = [];

let nucleus = null;

let ranking = [];


// ============================================================
// UTILIDADES
// ============================================================

function sleep(ms){

    return new Promise(
        resolve => setTimeout(resolve,ms)
    );

}


function pad(n){

    return String(n).padStart(2,"0");

}


function sum(arr){

    return arr.reduce(
        (a,b)=>a+b,
        0
    );

}


function unique(arr){

    return [...new Set(arr)];

}


function shuffle(arr){

    const a = [...arr];

    for(
        let i=a.length-1;
        i>0;
        i--
    ){

        const j =
            Math.floor(
                Math.random()*(i+1)
            );

        [
            a[i],
            a[j]
        ]=[
            a[j],
            a[i]
        ];

    }

    return a;

}


function clamp(
    value,
    min,
    max
){

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


// ============================================================
// FREQUÊNCIA
// ============================================================

function frequencyScore(data){

    const counts =
        Array(
            TOTAL_NUMBERS+1
        ).fill(0);

    data.forEach(
        draw=>{

            draw.dezenas.forEach(
                n=>{

                    if(
                        n>=1 &&
                        n<=25
                    ){

                        counts[n]++;

                    }

                }
            );

        }
    );

    const values =
        counts.slice(1);

    const max =
        Math.max(...values);

    const min =
        Math.min(...values);

    const range =
        Math.max(
            1,
            max-min
        );

    const score={};

    for(
        let n=1;
        n<=25;
        n++
    ){

        score[n]=
            (
                counts[n]-min
            )/
            range;

    }

    return {
        score,
        counts
    };

}


// ============================================================
// RECÊNCIA
// ============================================================

function recencyScore(data){

    const score={};

    for(
        let n=1;
        n<=25;
        n++
    ){

        score[n]=0;

    }

    const recent =
        data.slice(-40);

    recent.forEach(
        (
            draw,
            index
        )=>{

            const weight =
                (
                    index+1
                )/
                recent.length;

            draw.dezenas.forEach(
                n=>{

                    score[n]+=weight;

                }
            );

        }
    );

    const max =
        Math.max(
            ...Object.values(score)
        );

    for(
        let n=1;
        n<=25;
        n++
    ){

        score[n]=
            max
            ?
            score[n]/max
            :
            0;

    }

    return score;

}


// ============================================================
// ATRASO
// ============================================================

function delayScore(data){

    const raw={};

    for(
        let n=1;
        n<=25;
        n++
    ){

        let delay=0;

        for(
            let i=data.length-1;
            i>=0;
            i--
        ){

            if(
                data[i].dezenas.includes(n)
            ){

                break;

            }

            delay++;

        }

        raw[n]=delay;

    }

    const max =
        Math.max(
            ...Object.values(raw)
        );

    const result={};

    for(
        let n=1;
        n<=25;
        n++
    ){

        result[n]=
            max
            ?
            raw[n]/max
            :
            0;

    }

    return result;

}


// ============================================================
// CICLO
// ============================================================

function cycleScore(data){

    const result={};

    for(
        let n=1;
        n<=25;
        n++
    ){

        const positions=[];

        for(
            let i=0;
            i<data.length;
            i++
        ){

            if(
                data[i].dezenas.includes(n)
            ){

                positions.push(i);

            }

        }

        if(
            positions.length<2
        ){

            result[n]=0.5;

            continue;

        }

        const gaps=[];

        for(
            let i=1;
            i<positions.length;
            i++
        ){

            gaps.push(
                positions[i]-
                positions[i-1]
            );

        }

        const avg =
            gaps.reduce(
                (a,b)=>a+b,
                0
            )/
            gaps.length;

        const currentGap =
            data.length-
            1-
            positions[
                positions.length-1
            ];

        const distance =
            Math.abs(
                currentGap-avg
            );

        result[n]=
            1/
            (
                1+
                distance
            );

    }

    return result;

}


// ============================================================
// COOCORRÊNCIA
// ============================================================

function cooccurrenceScore(data){

    const pair =
        Array.from(
            {
                length:26
            },
            ()=>Array(
                26
            ).fill(0)
        );

    data.forEach(
        draw=>{

            const d =
                draw.dezenas;

            for(
                let i=0;
                i<d.length;
                i++
            ){

                for(
                    let j=i+1;
                    j<d.length;
                    j++
                ){

                    pair[d[i]][d[j]]++;

                    pair[d[j]][d[i]]++;

                }

            }

        }
    );

    const score={};

    for(
        let n=1;
        n<=25;
        n++
    ){

        score[n]=
            pair[n]
            .slice(1)
            .reduce(
                (a,b)=>a+b,
                0
            );

    }

    const max =
        Math.max(
            ...Object.values(score)
        );

    for(
        let n=1;
        n<=25;
        n++
    ){

        score[n]=
            max
            ?
            score[n]/max
            :
            0;

    }

    return score;

}


// ============================================================
// RANKING ADAPTATIVO
// ============================================================

function calculateRanking(data){

    const f =
        frequencyScore(data);

    const r =
        recencyScore(data);

    const d =
        delayScore(data);

    const c =
        cycleScore(data);

    const co =
        cooccurrenceScore(data);

    const result=[];

    for(
        let n=1;
        n<=25;
        n++
    ){

        /*
            V25.17

            Frequência    0.28
            Recência      0.20
            Atraso        0.12
            Ciclo         0.18
            Coocorrência  0.22
        */

        const score =

            f.score[n]*0.28 +

            r[n]*0.20 +

            d[n]*0.12 +

            c[n]*0.18 +

            co[n]*0.22;

        result.push({

            n,
            score,

            freq:
                f.score[n],

            recent:
                r[n],

            delay:
                d[n],

            cycle:
                c[n],

            co:
                co[n]

        });

    }

    result.sort(
        (a,b)=>
            b.score-a.score
    );

    return result;

}


// ============================================================
// NÚCLEO 15 + 5 + 5
// ============================================================

function buildNucleus(ranking){

    return {

        strong:
            ranking
            .slice(0,15)
            .map(
                x=>x.n
            ),

        protection:
            ranking
            .slice(15,20)
            .map(
                x=>x.n
            ),

        rotation:
            ranking
            .slice(20,25)
            .map(
                x=>x.n
            )

    };

}


// ============================================================
// ESTATÍSTICAS DO JOGO
// ============================================================

function gameStats(game){

    const even =
        game.filter(
            n=>n%2===0
        ).length;

    const odd =
        GAME_SIZE-even;

    let consecutive=0;

    for(
        let i=1;
        i<game.length;
        i++
    ){

        if(
            game[i]===
            game[i-1]+1
        ){

            consecutive++;

        }

    }

    const bands=[
        [1,5],
        [6,10],
        [11,15],
        [16,20],
        [21,25]
    ];

    const distribution =
        bands.map(
            ([a,b])=>
                game.filter(
                    n=>
                        n>=a &&
                        n<=b
                ).length
        );

    return {

        even,
        odd,

        sum:
            sum(game),

        consecutive,

        distribution

    };

}


// ============================================================
// SOBREPOSIÇÃO
// ============================================================

function overlap(a,b){

    return a.filter(
        n=>b.includes(n)
    ).length;

}


// ============================================================
// DISTÂNCIA ENTRE JOGOS
// ============================================================

function diversityPenalty(
    candidate,
    existing
){

    if(
        !existing.length
    ){

        return 0;

    }

    let total=0;

    existing.forEach(
        game=>{

            total +=
                overlap(
                    candidate,
                    game
                );

        }
    );

    return (
        total/
        existing.length
    );

}


// ============================================================
// PENALIDADE DE FAIXAS
// ============================================================

function bandPenalty(
    distribution,
    target
){

    let penalty=0;

    for(
        let i=0;
        i<5;
        i++
    ){

        penalty +=
            Math.abs(
                distribution[i]-
                target[i]
            );

    }

    return penalty;

}


// ============================================================
// PERFIS DOS 6 JOGOS
// ============================================================

const PROFILES=[

    {
        name:"Força",
        strong:11,
        protection:2,
        rotation:2,
        evenMin:6,
        evenMax:9,
        sumMin:185,
        sumMax:215,
        targetBands:[3,3,3,3,3]
    },

    {
        name:"Equilíbrio",
        strong:10,
        protection:3,
        rotation:2,
        evenMin:6,
        evenMax:9,
        sumMin:180,
        sumMax:220,
        targetBands:[3,3,3,3,3]
    },

    {
        name:"Proteção",
        strong:9,
        protection:4,
        rotation:2,
        evenMin:6,
        evenMax:9,
        sumMin:175,
        sumMax:220,
        targetBands:[3,3,3,3,3]
    },

    {
        name:"Rotação",
        strong:9,
        protection:2,
        rotation:4,
        evenMin:5,
        evenMax:10,
        sumMin:175,
        sumMax:225,
        targetBands:[3,3,3,3,3]
    },

    {
        name:"Diversidade",
        strong:8,
        protection:3,
        rotation:4,
        evenMin:5,
        evenMax:10,
        sumMin:170,
        sumMax:225,
        targetBands:[3,3,3,3,3]
    },

    {
        name:"Cobertura",
        strong:8,
        protection:4,
        rotation:3,
        evenMin:5,
        evenMax:10,
        sumMin:170,
        sumMax:230,
        targetBands:[3,3,3,3,3]
    }

];


// ============================================================
// CONSTRUTOR DE CANDIDATO
// ============================================================

function buildCandidate(
    nucleus,
    profile
){

    let candidate=[];

    candidate.push(
        ...shuffle(
            nucleus.strong
        ).slice(
            0,
            profile.strong
        )
    );

    candidate.push(
        ...shuffle(
            nucleus.protection
        ).slice(
            0,
            profile.protection
        )
    );

    candidate.push(
        ...shuffle(
            nucleus.rotation
        ).slice(
            0,
            profile.rotation
        )
    );

    candidate =
        unique(candidate);

    return candidate;

}


// ============================================================
// COMPLETAR CANDIDATO
// ============================================================

function completeCandidate(
    candidate,
    ranking
){

    const result =
        unique(candidate);

    const ranked =
        ranking.map(
            x=>x.n
        );

    let attempts=0;

    while(
        result.length<15 &&
        attempts<300
    ){

        const n =
            ranked[
                Math.floor(
                    Math.random()*
                    ranked.length
                )
            ];

        if(
            !result.includes(n)
        ){

            result.push(n);

        }

        attempts++;

    }

    return result
        .sort(
            (a,b)=>a-b
        )
        .slice(
            0,
            15
        );

}


// ============================================================
// SCORE DO JOGO
// ============================================================

function rawGameScore(
    game,
    ranking
){

    let total=0;

    game.forEach(
        n=>{

            const item =
                ranking.find(
                    x=>x.n===n
                );

            if(item){

                total +=
                    item.score;

            }

        }
    );

    return total;

}


// ============================================================
// AVALIAÇÃO DO CANDIDATO
// ============================================================

function candidateScore(
    game,
    ranking,
    existing,
    profile
){

    const stats =
        gameStats(
            game
        );

    let value =
        rawGameScore(
            game,
            ranking
        );


    // --------------------------------------------------------
    // EQUILÍBRIO DE PARES
    // --------------------------------------------------------

    if(
        stats.even<
        profile.evenMin
    ){

        value -=
            (
                profile.evenMin-
                stats.even
            )*0.20;

    }

    if(
        stats.even>
        profile.evenMax
    ){

        value -=
            (
                stats.even-
                profile.evenMax
            )*0.20;

    }


    // --------------------------------------------------------
    // SOMA
    // --------------------------------------------------------

    if(
        stats.sum<
        profile.sumMin
    ){

        value -=
            (
                profile.sumMin-
                stats.sum
            )*0.018;

    }

    if(
        stats.sum>
        profile.sumMax
    ){

        value -=
            (
                stats.sum-
                profile.sumMax
            )*0.018;

    }


    // --------------------------------------------------------
    // CONSECUTIVAS
    // --------------------------------------------------------

    if(
        stats.consecutive>10
    ){

        value -=
            (
                stats.consecutive-
                10
            )*0.15;

    }


    // --------------------------------------------------------
    // DISTRIBUIÇÃO DAS FAIXAS
    // --------------------------------------------------------

    value -=
        bandPenalty(
            stats.distribution,
            profile.targetBands
        )*0.08;


    // --------------------------------------------------------
    // DIVERSIFICAÇÃO
    // --------------------------------------------------------

    const repeat =
        diversityPenalty(
            game,
            existing
        );

    /*
        V25.17:

        Penalização maior
        para jogos semelhantes.
    */

    value -=
        repeat*0.18;


    return value;

}


// ============================================================
// MELHORAR CANDIDATO
// ============================================================

function improveCandidate(
    game,
    ranking,
    profile
){

    let result =
        unique(game);

    const ranked =
        ranking.map(
            x=>x.n
        );

    let attempts=0;

    while(
        result.length<15 &&
        attempts<200
    ){

        const n =
            ranked[
                Math.floor(
                    Math.random()*
                    ranked.length
                )
            ];

        if(
            !result.includes(n)
        ){

            result.push(n);

        }

        attempts++;

    }

    result =
        unique(result)
        .slice(0,15)
        .sort(
            (a,b)=>a-b
        );

    return result;

}


// ============================================================
// GERAR UM JOGO OTIMIZADO
// ============================================================

function generateOneGame(
    nucleus,
    ranking,
    existing,
    profile
){

    let best=null;

    let bestScore=-Infinity;

    /*
        Grande número de candidatos
        para aumentar a diversidade.
    */

    for(
        let attempt=0;
        attempt<500;
        attempt++
    ){

        let candidate =
            buildCandidate(
                nucleus,
                profile
            );

        candidate =
            improveCandidate(
                candidate,
                ranking,
                profile
            );

        if(
            candidate.length!==15
        ){

            continue;

        }

        const value =
            candidateScore(
                candidate,
                ranking,
                existing,
                profile
            );

        if(
            value>bestScore
        ){

            bestScore=value;

            best=candidate;

        }

    }

    return best;

}


// ============================================================
// GERAR OS 6 JOGOS
// ============================================================

function generateGames(
    nucleus,
    ranking
){

    const result=[];

    for(
        let i=0;
        i<TOTAL_GAMES;
        i++
    ){

        const profile =
            PROFILES[i];

        const game =
            generateOneGame(
                nucleus,
                ranking,
                result,
                profile
            );

        if(game){

            result.push(
                game
            );

        }

    }

    /*
        Garantia final de 6 jogos.
    */

    while(
        result.length<
        TOTAL_GAMES
    ){

        const fallback =
            generateOneGame(
                nucleus,
                ranking,
                result,
                PROFILES[
                    result.length
                ]
            );

        if(
            fallback
        ){

            result.push(
                fallback
            );

        }else{

            break;

        }

    }

    /*
        Segunda etapa:

        tentativa de aumentar
        a cobertura das 25 dezenas.
    */

    return optimizeCoverage(
        result,
        nucleus,
        ranking
    );

}


// ============================================================
// OTIMIZAÇÃO DA COBERTURA
// ============================================================

function optimizeCoverage(
    games,
    nucleus,
    ranking
){

    if(
        games.length!==6
    ){

        return games;

    }

    let result =
        games.map(
            g=>[...g]
        );

    let all =
        unique(
            result.flat()
        );

    /*
        Se já temos 25/25,
        não alteramos.
    */

    if(
        all.length>=25
    ){

        return result;

    }


    const missing =
        Array.from(
            {
                length:25
            },
            (_,i)=>i+1
        ).filter(
            n=>!all.includes(n)
        );

    /*
        Tentamos inserir cada
        dezena ausente em um jogo
        trocando uma dezena repetida.
    */

    missing.forEach(
        missingNumber=>{

            let bestGame=-1;

            let bestPosition=-1;

            let bestPenalty=Infinity;

            for(
                let i=0;
                i<result.length;
                i++
            ){

                for(
                    let p=0;
                    p<result[i].length;
                    p++
                ){

                    const candidate =
                        [
                            ...result[i]
                        ];

                    candidate[p]=
                        missingNumber;

                    candidate.sort(
                        (a,b)=>a-b
                    );

                    const stats =
                        gameStats(
                            candidate
                        );

                    const duplicate =
                        result
                        .filter(
                            (_,j)=>j!==i
                        )
                        .reduce(
                            (
                                total,
                                g
                            )=>
                                total+
                                overlap(
                                    candidate,
                                    g
                                ),
                            0
                        );

                    let penalty =
                        duplicate*0.5;

                    if(
                        stats.even<5 ||
                        stats.even>10
                    ){

                        penalty+=3;

                    }

                    if(
                        stats.sum<165 ||
                        stats.sum>230
                    ){

                        penalty+=2;

                    }

                    if(
                        penalty<
                        bestPenalty
                    ){

                        bestPenalty=
                            penalty;

                        bestGame=i;

                        bestPosition=p;

                    }

                }

            }

            if(
                bestGame>=0
            ){

                result[
                    bestGame
                ][
                    bestPosition
                ]=
                    missingNumber;

                result[
                    bestGame
                ].sort(
                    (a,b)=>a-b
                );

            }

        }
    );

    return result;

}


// ============================================================
// WALK-FORWARD
// ============================================================

function walkForward(data){

    const tests=[];

    const start =
        Math.max(
            35,
            data.length-60
        );

    for(
        let i=start;
        i<data.length;
        i++
    ){

        const training =
            data.slice(
                0,
                i
            );

        const actual =
            data[i].dezenas;

        if(
            training.length<30
        ){

            continue;

        }

        const localRanking =
            calculateRanking(
                training
            );

        const localNucleus =
            buildNucleus(
                localRanking
            );

        const generated =
            generateGames(
                localNucleus,
                localRanking
            );

        let best=0;

        generated.forEach(
            game=>{

                const hits =
                    overlap(
                        game,
                        actual
                    );

                best =
                    Math.max(
                        best,
                        hits
                    );

            }
        );

        tests.push({

            concurso:
                data[i].concurso,

            best

        });

    }

    if(
        !tests.length
    ){

        return {

            tests:0,

            model:0,

            baseline:0,

            advantage:0

        };

    }

    const model =
        tests.reduce(
            (a,b)=>
                a+b.best,
            0
        )/
        tests.length;


    // --------------------------------------------------------
    // BASELINE
    // --------------------------------------------------------

    const baselineResults=[];

    for(
        let i=start;
        i<data.length;
        i++
    ){

        const training =
            data.slice(
                0,
                i
            );

        const actual =
            data[i].dezenas;

        const freq =
            frequencyScore(
                training
            );

        const base =
            Array.from(
                {
                    length:25
                },
                (_,j)=>j+1
            )
            .sort(
                (a,b)=>
                    freq.counts[b]-
                    freq.counts[a]
            )
            .slice(
                0,
                15
            );

        baselineResults.push(
            overlap(
                base,
                actual
            )
        );

    }

    const baseline =
        baselineResults.reduce(
            (a,b)=>a+b,
            0
        )/
        baselineResults.length;

    return {

        tests:
            tests.length,

        model,

        baseline,

        advantage:
            model-baseline

    };

}


// ============================================================
// COBERTURA
// ============================================================

function coverage(games){

    const all =
        unique(
            games.flat()
        );

    return {

        unique:
            all.length,

        percent:
            Math.round(
                all.length/
                25*
                100
            )

    };

}


// ============================================================
// REPETIÇÃO
// ============================================================

function repetition(games){

    const values=[];

    for(
        let i=0;
        i<games.length;
        i++
    ){

        for(
            let j=i+1;
            j<games.length;
            j++
        ){

            values.push(
                overlap(
                    games[i],
                    games[j]
                )
            );

        }

    }

    if(
        !values.length
    ){

        return 0;

    }

    return (
        values.reduce(
            (a,b)=>a+b,
            0
        )/
        values.length
    );

}


// ============================================================
// DIVERSIDADE
// ============================================================

function diversity(games){

    const rep =
        repetition(
            games
        );

    return clamp(
        15-rep,
        0,
        15
    );

}

function saveGame(index){

    if(
        !games[index] ||
        !latest
    ){

        return;

    }

    const saved =
        getSaved();

    saved.push({

        versao:
            VERSION,

        concurso:
            latest.concurso+1,

        jogo:
            index+1,

        dezenas:
            games[index],

        salvoEm:
            new Date().toISOString()

    });

    saveSaved(
        saved
    );

    alert(
        `Jogo ${index+1} salvo para o concurso ${latest.concurso+1}.`
    );

}


function saveAll(){

    if(
        !latest

        return;

    }

    const saved =
        getSaved();

    games.forEach(

            game,
            index

                    VERSION,

                concurso:
                    latest.concurso+1,

                jogo:
                    index+1,

                dezenas:

                salvoEm:
                    new Date().toISOString()

    );

    alert(
        "Os 6 jogos foram salvos para o concurso " +
        (latest.concurso+1) +

    );

function copyGame(index){

    if(
        !games[index]
    ){

        return;

    }

    const text =
        games[index]
        .map(pad)
        .join(" ");

    if(
        navigator.clipboard
    ){

        navigator.clipboard
            .writeText(text)
            .then(
                ()=>{

                    alert(
                        `Jogo ${index+1} copiado.`
                    );

                }
            );

    }else{

        alert(text);

    }

}

// CARREGAMENTO DO HISTÓRICO
// ============================================================

async function fetchHistory(){

    /*
        Primeiro tenta o endpoint principal
        utilizado pelo backend atual.
    */

    const endpoints=[

        "/api/history?limit=120",

        "/api/lotofacil/history?limit=120",

        "/history?limit=120"

    ];


    let lastError=null;


    for(
        const endpoint of endpoints
    ){

        try{

            const response =
                await fetch(
                    endpoint,
                    {
                        cache:"no-store"
                    }
                );


            if(
                !response.ok
            ){

                throw new Error(
                    `HTTP ${response.status}`
                );

            }


            const payload =
                await response.json();


            let data=[];


            /*
                Formato:

                {
                    resultados:[]
                }
            */

            if(
                Array.isArray(
                    payload.resultados
                )
            ){

                data =
                    payload.resultados;

            }


            /*
                Formato:

                {
                    data:[]
                }
            */

            else if(
                Array.isArray(
                    payload.data
                )
            ){

                data =
                    payload.data;

            }


            /*
                Formato:

                {
                    results:[]
                }
            */

            else if(
                Array.isArray(
                    payload.results
                )
            ){

                data =
                    payload.results;

            }


            /*
                Caso o backend
                devolva diretamente
                uma lista.
            */

            else if(
                Array.isArray(
                    payload
                )
            ){

                data =
                    payload;

            }


            if(
                !data.length
            ){

                throw new Error(
                    "Histórico vazio."
                );

            }


            return data;

        }catch(error){

            lastError=error;

        }

    }


    throw lastError ||
        new Error(
            "Não foi possível carregar o histórico."
        );

}


// ============================================================
// NORMALIZAR HISTÓRICO
// ============================================================

function normalizeHistory(data){

    const normalized=[];


    data.forEach(
        item=>{

            if(
                !item ||
                !item.dezenas
            ){

                return;

            }


            const dezenas =
                item.dezenas
                .map(
                    Number
                )
                .filter(
                    n=>
                        n>=1 &&
                        n<=25
                );


            const uniqueNumbers =
                unique(
                    dezenas
                );


            if(
                uniqueNumbers.length!==15
            ){

                return;

            }


            const concurso =
                Number(
                    item.concurso ??
                    item.numero ??
                    item.numeroConcurso
                );


            if(
                !Number.isFinite(
                    concurso
                )
            ){

                return;

            }


            normalized.push({

                concurso,

                data:
                    String(
                        item.data ??
                        item.dataApuracao ??
                        ""
                    ),

                dezenas:
                    uniqueNumbers.sort(
                        (a,b)=>a-b
                    )

            });

        }
    );


    const map =
        new Map();


    normalized.forEach(
        item=>{

            map.set(
                item.concurso,
                item
            );

        }
    );


    return Array.from(
        map.values()
    )
    .sort(
        (a,b)=>
            a.concurso-
            b.concurso
    )
    .slice(
        -HISTORY_LIMIT
    );

}


// ============================================================
// INICIALIZAÇÃO
// ============================================================

async function load(){

    try{

        const data =
            await fetchHistory();


        history =
            normalizeHistory(
                data
            );


        if(
            !history.length
        ){

            throw new Error(
                "Histórico vazio."
            );

        }


        latest =
            history[
                history.length-1
            ];


        render();


    }catch(error){

        document.getElementById(
            "app"
        ).innerHTML = `

            <div class="card">

                <div class="section-title error">
                    ❌ Erro
                </div>

                <div class="muted">

                    Não foi possível carregar
                    os resultados da Lotofácil.

                    <br><br>

                    ${error.message}

                </div>


                <div class="buttons">

                    <button
                        class="btn-blue"
                        onclick="location.reload()"
                    >
                        🔄 Tentar novamente
                    </button>

                </div>

            </div>

        `;

    }

}


load();

</script>
