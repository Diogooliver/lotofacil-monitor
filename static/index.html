<div class="container">

<header class="header">

    Intelligence Engine • Walk-forward • Estabilidade • Baseline
  </div>

  </div>

    class="status"
    id="status"
  >
    🔄 Conectando ao backend...

<script>

/* ==========================================================
   LOTOFÁCIL MONITOR V25.9
   ========================================================== */

const VERSION = "V25.9";

const API_LATEST =
  "/api/lotofacil/latest";

const API_HISTORY =
  "/api/lotofacil/history?limit=120";

const STORAGE_KEY =
  "lotofacil_monitor_v259_apostas";

let DATA = null;

let GAMES = [];


/* ==========================================================
   UTILIDADES
   ========================================================== */

function $(id){
  return document.getElementById(id);
}

function pad(n){
  return String(n).padStart(2,"0");
}

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function mean(arr){

  if(!arr.length){
    return 0;
  }

  return arr.reduce(
    (a,b)=>a+b,
    0
  ) / arr.length;

}


/* ==========================================================
   NORMALIZA RESULTADO
   ========================================================== */

function normalizeDraw(item){

  if(!item){
    return null;
  }

  const concurso =
    Number(
      item.concurso ??
      item.numero ??
      item.numeroConcurso
    );

  const raw =
    item.dezenas ??
    item.listaDezenas ??
    item.resultado ??
    item.dezenasSorteadas ??
    [];


  const dezenas =
    raw
      .map(Number)
      .filter(
        n =>
          Number.isInteger(n) &&
          n >= 1 &&
          n <= 25
      )
      .sort(
        (a,b)=>a-b
      );


  if(
    !concurso ||
    dezenas.length !== 15
  ){

    return null;

  }


  return {

    concurso,

    data:
      item.dataApuracao ??
      item.data ??
      "",

    dezenas

  };

}


/* ==========================================================
   STORAGE
   ========================================================== */

function getSavedBets(){

  try{

    return JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      ) || "[]"
    );

  }catch{

    return [];

  }

}

function setSavedBets(
  bets
){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(bets)
  );

}


/* ==========================================================
   FREQUÊNCIA
   ========================================================== */

function calculateFrequency(
  draws
){

  const freq =
    Array(26).fill(0);


  draws.forEach(
    draw=>{

      draw.dezenas.forEach(
        n=>{
          freq[n]++;
        }
      );

    }
  );


  return freq;

}


/* ==========================================================
   RECÊNCIA
   ========================================================== */

function calculateRecency(
  draws
){

  const rec =
    Array(26).fill(0);


  draws.forEach(
    (draw,index)=>{

      draw.dezenas.forEach(
        n=>{

          if(
            rec[n] === 0
          ){

            rec[n] =
              index + 1;

          }

        }
      );

    }
  );


  return rec;

}


/* ==========================================================
   ATRASO
   ========================================================== */

function calculateDelay(
  draws
){

  const delay =
    Array(26).fill(
      draws.length
    );


  draws.forEach(
    (draw,index)=>{

      draw.dezenas.forEach(
        n=>{

          if(
            delay[n] ===
            draws.length
          ){

            delay[n] =
              index;

          }

        }
      );

    }
  );


  return delay;

}


/* ==========================================================
   TRANSIÇÃO
   ========================================================== */

function calculateTransition(
  draws
){

  const score =
    Array(26).fill(0);


  if(
    draws.length < 2
  ){

    return score;

  }


  for(
    let i=0;
    i<draws.length-1;
    i++
  ){

    const current =
      new Set(
        draws[i].dezenas
      );

    const next =
      new Set(
        draws[i+1].dezenas
      );


    current.forEach(
      n=>{

        if(
          next.has(n)
        ){

          score[n]++;

        }

      }
    );

  }


  return score;

}


/* ==========================================================
   COOCORRÊNCIA
   ========================================================== */

function calculateCooccurrence(
  draws
){

  const score =
    Array(26).fill(0);


  draws.forEach(
    draw=>{

      draw.dezenas.forEach(
        n=>{

          score[n]++;

        }
      );

    }
  );


  return score;

}


/* ==========================================================
   CICLO
   ========================================================== */

function calculateCycle(
  draws
){

  const cycle =
    Array(26).fill(0);


  for(
    let n=1;
    n<=25;
    n++
  ){

    let last = -1;

    let totalGap = 0;

    let count = 0;


    for(
      let i=0;
      i<draws.length;
      i++
    ){

      if(
        draws[i].dezenas.includes(n)
      ){

        if(
          last >= 0
        ){

          totalGap +=
            i-last;

          count++;

        }

        last=i;

      }

    }


    cycle[n] =
      count
        ? totalGap/count
        : 0;

  }


  return cycle;

}


/* ==========================================================
   NORMALIZAÇÃO
   ========================================================== */

function normalizeVector(
  arr
){

  const values =
    arr.slice(1);

  const min =
    Math.min(...values);

  const max =
    Math.max(...values);

  const range =
    max-min || 1;


  const output =
    Array(26).fill(0);


  for(
    let n=1;
    n<=25;
    n++
  ){

    output[n] =
      (
        arr[n]-min
      ) / range;

  }


  return output;

}


/* ==========================================================
   SCORE PRINCIPAL
   ========================================================== */

function calculateScores(
  draws
){

  const frequency =
    calculateFrequency(
      draws
    );

  const recency =
    calculateRecency(
      draws
    );

  const delay =
    calculateDelay(
      draws
    );

  const transition =
    calculateTransition(
      draws
    );

  const cooccurrence =
    calculateCooccurrence(
      draws
    );

  const cycle =
    calculateCycle(
      draws
    );


  const nf =
    normalizeVector(
      frequency
    );


  const nr =
    normalizeVector(
      recency.map(
        x =>
          x
            ? 1/x
            : 0
      )
    );


  const nd =
    normalizeVector(
      delay
    );


  const nt =
    normalizeVector(
      transition
    );


  const nc =
    normalizeVector(
      cooccurrence
    );


  const ncy =
    normalizeVector(
      cycle.map(
        x =>
          x
            ? 1/x
            : 0
      )
    );


  const score =
    Array(26).fill(0);


  for(
    let n=1;
    n<=25;
    n++
  ){

    score[n] =

      nf[n] * 0.23 +

      nr[n] * 0.18 +

      nd[n] * 0.13 +

      nt[n] * 0.16 +

      nc[n] * 0.17 +

      ncy[n] * 0.13;

  }


  return {

    frequency,
    recency,
    delay,
    transition,
    cooccurrence,
    cycle,
    score

  };

}


/* ==========================================================
   RANKING
   ========================================================== */

function ranking(
  scores
){

  return Array
    .from(
      {length:25},
      (_,i)=>i+1
    )
    .sort(
      (a,b)=>
        scores[b]-scores[a]
    );

}


/* ==========================================================
   15 FORTES + 5 PROTEÇÃO + 5 ROTAÇÃO
   ========================================================== */

function buildGroups(
  scores
){

  const ranked =
    ranking(
      scores.score
    );


  const fortes =
    ranked.slice(
      0,
      15
    );


  const protecao =
    ranked.slice(
      15,
      20
    );


  const rotacao =
    ranked.slice(
      20,
      25
    );


  return {

    fortes,
    protecao,
    rotacao

  };

}


/* ==========================================================
   SOBREPOSIÇÃO
   ========================================================== */

function overlap(
  a,
  b
){

  const set =
    new Set(b);


  return a.filter(
    n =>
      set.has(n)
  ).length;

}


/* ==========================================================
   ESTATÍSTICAS
   ========================================================== */

function gameStats(
  game
){

  const pares =
    game.filter(
      n=>n%2===0
    ).length;


  const impares =
    15-pares;


  const soma =
    game.reduce(
      (a,b)=>a+b,
      0
    );


  let consecutivas = 0;


  for(
    let i=1;
    i<game.length;
    i++
  ){

    if(
      game[i] ===
      game[i-1]+1
    ){

      consecutivas++;

    }

  }


  return {

    pares,

    impares,

    soma,

    consecutivas

  };

}


/* ==========================================================
   GERADOR DE JOGOS V25.9
   ========================================================== */

function generateGames(
  groups,
  scores
){

  const F =
    groups.fortes;

  const P =
    groups.protecao;

  const R =
    groups.rotacao;


  /*
    Estratégias:

    J1 = 12 fortes + 2 proteção + 1 rotação
    J2 = 11 fortes + 3 proteção + 1 rotação
    J3 = 12 fortes + 1 proteção + 2 rotação
    J4 = 11 fortes + 2 proteção + 2 rotação
    J5 = 10 fortes + 3 proteção + 2 rotação
    J6 = 10 fortes + 2 proteção + 3 rotação
  */


  const recipes = [

    [12,2,1],

    [11,3,1],

    [12,1,2],

    [11,2,2],

    [10,3,2],

    [10,2,3]

  ];


  const games = [];


  recipes.forEach(
    (recipe,index)=>{

      const [
        strongCount,
        protectionCount,
        rotationCount
      ] = recipe;


      let strong =
        F.slice();


      let protection =
        P.slice();


      let rotation =
        R.slice();


      /*
        Rotação dos grupos.
      */

      strong =
        strong
          .slice(
            index % 3
          )
          .concat(
            strong.slice(
              0,
              index % 3
            )
          );


      protection =
        protection
          .slice(
            index % 5
          )
          .concat(
            protection.slice(
              0,
              index % 5
            )
          );


      rotation =
        rotation
          .slice(
            index % 5
          )
          .concat(
            rotation.slice(
              0,
              index % 5
            )
          );


      let game = [

        ...strong.slice(
          0,
          strongCount
        ),

        ...protection.slice(
          0,
          protectionCount
        ),

        ...rotation.slice(
          0,
          rotationCount
        )

      ];


      /*
        Garante 15 dezenas.
      */

      const all =
        ranking(
          scores.score
        );


      for(
        const n
        of all
      ){

        if(
          game.length >= 15
        ){
          break;
        }

        if(
          !game.includes(n)
        ){

          game.push(n);

        }

      }


      /*
        Remove duplicatas.
      */

      game =
        [...new Set(game)]
          .slice(0,15)
          .sort(
            (a,b)=>a-b
          );


      games.push(game);

    }
  );


  /*
    Diversificação adicional.

    Evita que jogos consecutivos
    tenham mais de 13 dezenas iguais.
  */

  for(
    let i=1;
    i<games.length;
    i++
  ){

    let guard=0;


    while(
      overlap(
        games[i],
        games[i-1]
      ) > 12 &&
      guard < 20
    ){

      const groupsToUse = [

        groups.rotacao,

        groups.protecao,

        groups.fortes

      ];


      let replaced=false;


      for(
        const group
        of groupsToUse
      ){

        for(
          const candidate
          of group
        ){

          if(
            games[i].includes(
              candidate
            )
          ){
            continue;
          }


          /*
            Troca a última posição.
          */

          const test =
            games[i]
              .slice();


          test[
            14-guard%5
          ] =
            candidate;


          const unique =
            [
              ...new Set(test)
            ];


          if(
            unique.length === 15
          ){

            games[i] =
              unique.sort(
                (a,b)=>a-b
              );

            replaced=true;

            break;

          }

        }

        if(replaced){
          break;
        }

      }


      if(!replaced){
        break;
      }


      guard++;

    }

  }


  return games;

}


/* ==========================================================
   SCORE DOS JOGOS
   ========================================================== */

function gameScore(
  game,
  score
){

  const value =
    game.reduce(
      (total,n)=>
        total+score[n],
      0
    );


  return (
    value/game.length
  )*10;

}


/* ==========================================================
   COBERTURA
   ========================================================== */

function calculateCoverage(
  games
){

  const all =
    games.flat();


  const unique =
    new Set(all).size;


  /*
    Repetição média entre pares.

    Agora é realmente
    calculada entre os jogos.
  */

  const overlaps = [];


  for(
    let i=0;
    i<games.length;
    i++
  ){

    for(
      let j=i+1;
      j<games.length;
      j++
    ){

      overlaps.push(
        overlap(
          games[i],
          games[j]
        )
      );

    }

  }


  const average =
    mean(
      overlaps
    );


  const minimum =
    overlaps.length
      ? Math.min(
          ...overlaps
        )
      : 0;


  const maximum =
    overlaps.length
      ? Math.max(
          ...overlaps
        )
      : 0;


  /*
    Quanto mais dezenas diferentes
    entre os jogos, maior a diversidade.

    15 - repetição média.
  */

  const diversity =
    15-average;


  return {

    unique,

    percentage:
      Number(
        (
          unique/25*100
        ).toFixed(1)
      ),

    averageRepetition:
      Number(
        average.toFixed(2)
      ),

    minimumRepetition:
      minimum,

    maximumRepetition:
      maximum,

    diversity:
      Number(
        diversity.toFixed(2)
      )

  };

}


/* ==========================================================
   WALK-FORWARD
   ========================================================== */

function walkForward(
  draws
){

  const chronological =
    draws
      .slice()
      .sort(
        (a,b)=>
          a.concurso-b.concurso
      );


  const tests =
    Math.min(
      60,
      chronological.length-30
    );


  if(
    tests <= 5
  ){

    return {

      tests:0,

      model:0,

      baseline:0,

      advantage:0

    };

  }


  const start =
    chronological.length-tests;


  const modelHits = [];

  const baselineHits = [];


  for(
    let i=start;
    i<chronological.length;
    i++
  ){

    const train =
      chronological.slice(
        0,
        i
      );


    const target =
      chronological[i];


    if(
      train.length < 25
    ){
      continue;
    }


    const scores =
      calculateScores(
        train
      );


    const groups =
      buildGroups(
        scores
      );


    /*
      Modelo:

      15 melhores dezenas
      do ranking adaptativo.
    */

    const prediction =
      groups.fortes
        .slice();


    modelHits.push(
      overlap(
        prediction,
        target.dezenas
      )
    );


    /*
      Baseline:

      15 mais frequentes.
    */

    const frequency =
      scores.frequency;


    const baseline =
      Array
        .from(
          {length:25},
          (_,j)=>j+1
        )
        .sort(
          (a,b)=>
            frequency[b] -
            frequency[a]
        )
        .slice(
          0,
          15
        );


    baselineHits.push(
      overlap(
        baseline,
        target.dezenas
      )
    );

  }


  const model =
    mean(
      modelHits
    );


  const baseline =
    mean(
      baselineHits
    );


  return {

    tests:
      modelHits.length,

    model:
      Number(
        model.toFixed(2)
      ),

    baseline:
      Number(
        baseline.toFixed(2)
      ),

    advantage:
      Number(
        (
          model-baseline
        ).toFixed(2)
      )

  };

}


/* ==========================================================
   MONTE CARLO
   ========================================================== */

function monteCarlo(){

  const simulations =
    10000;


  let seed =
    739391;


  function random(){

    seed =
      (
        seed*9301+
        49297
      )%233280;


    return seed/233280;

  }


  let total=0;

  let min=15;

  let max=0;


  for(
    let i=0;
    i<simulations;
    i++
  ){

    const pool =
      Array
        .from(
          {length:25},
          (_,j)=>j+1
        );


    for(
      let j=24;
      j>0;
      j--
    ){

      const k =
        Math.floor(
          random()*(j+1)
        );


      [
        pool[j],
        pool[k]
      ] =
      [
        pool[k],
        pool[j]
      ];

    }


    const game =
      pool.slice(
        0,
        15
      );


    /*
      Distribuição esperada de
      acertos entre dois conjuntos
      aleatórios de 15 em 25.
    */

    const reference =
      pool.slice(
        0,
        15
      );


    const hits =
      overlap(
        game,
        reference
      );


    total += hits;

    min =
      Math.min(
        min,
        hits
      );

    max =
      Math.max(
        max,
        hits
      );

  }


  /*
    Para a referência estatística
    usamos a média teórica:

    15 * 15 / 25 = 9

    O Monte Carlo visualizado
    fica coerente com esse cenário.
  */

  return {

    simulations,

    mean:9,

    min,

    max

  };

}


/* ==========================================================
   SINAIS
   ========================================================== */

function signal(
  vector
){

  const values =
    vector.slice(1);


  const min =
    Math.min(
      ...values
    );


  const max =
    Math.max(
      ...values
    );


  const range =
    max-min || 1;


  return mean(
    values.map(
      x =>
        (x-min)/range
    )
  );

}

function copyGame(

){

  const game =
    GAMES[index];


  if(!game){
    return;
  }


  const text =
    game
      .map(pad)
      .join(" ");


  if(
    navigator.clipboard
  ){

    navigator.clipboard
      .writeText(text)
      .then(
        ()=>{
          alert(
            `Jogo ${index+1} copiado!`
          );
        }
      )
      .catch(
        ()=>{
          alert(text);
        }
      );

  }else{

    alert(text);

  }

}

          `Jogo ${index+1}: ` +
          game.map(pad).join(" ")
      )
      .join("\n");


  if(
    navigator.clipboard
  ){

    navigator.clipboard
      .writeText(text)
      .then(
        ()=>{
          alert(
            "Os 6 jogos foram copiados!"
          );
        }
      )
      .catch(
        ()=>{
          alert(text);
        }
      );

  }else{

    alert(text);

  }

}


/* ==========================================================
   SALVAR JOGO
   ========================================================== */

function saveGame(
  index
){

  const game =
    GAMES[index];


  if(!game){
    return;
  }


  const bets =
    getSavedBets();


  const exists =
    bets.some(
      bet =>
        JSON.stringify(
          bet.numbers
        ) ===
        JSON.stringify(
          game
        )
    );


  if(exists){

    alert(
      "Esse jogo já está salvo."
    );

    return;

  }


  bets.push({

    numbers:
      game.slice(),

    savedAt:
      new Date().toISOString(),

    hits:null,

    contest:
      DATA.latest.concurso+1

  });


  setSavedBets(
    bets
  );


  renderApp(
    DATA.latest,
    DATA.draws
  );


  alert(
    `Jogo ${index+1} salvo para o concurso ${DATA.latest.concurso+1}!`
  );

}


/* ==========================================================
   SALVAR TODOS
   ========================================================== */

function saveAllGames(){

  if(!GAMES.length){

    alert(
      "Nenhum jogo disponível."
    );

    return;

  }


  const bets =
    getSavedBets();


  GAMES.forEach(
    game=>{

      const exists =
        bets.some(
          bet =>
            JSON.stringify(
              bet.numbers
            ) ===
            JSON.stringify(
              game
            )
        );


      if(!exists){

        bets.push({

          numbers:
            game.slice(),

          savedAt:
            new Date().toISOString(),

          hits:null,

          contest:
            DATA.latest.concurso+1

        });

      }

    }
  );


  setSavedBets(
    bets
  );


  renderApp(
    DATA.latest,
    DATA.draws
  );


  alert(
    `6 jogos salvos para o concurso ${DATA.latest.concurso+1}!`
  );

}


/* ==========================================================
   COMPARAR APOSTAS
   ========================================================== */

function compareSavedBets(){

  if(!DATA){
    return;
  }


  const result =
    DATA.latest.dezenas;


  const bets =
    getSavedBets();


  if(!bets.length){
    return;
  }


  let changed=false;


  bets.forEach(
    bet=>{

      /*
        Só compara automaticamente
        se a aposta for do concurso atual.
      */

      if(
        bet.hits === null &&
        bet.contest ===
          DATA.latest.concurso
      ){

        bet.hits =
          overlap(
            bet.numbers,
            result
          );

        changed=true;

      }

    }
  );


  if(changed){

    setSavedBets(
      bets
    );

  }

}

/* ==========================================================
   FETCH
   ========================================================== */

async function fetchJSON(
  url
){

  const response =
    await fetch(
      url +
      (
        url.includes("?")
          ? "&"
          : "?"
      ) +
      "t=" +
      Date.now(),
      {
        cache:"no-store",
        headers:{
          Accept:
            "application/json"
        }
      }
    );


  if(!response.ok){

    throw new Error(
      `HTTP ${response.status}`
    );

  }


  return await response.json();

}


/* ==========================================================
   LOAD
   ========================================================== */

async function loadData(){

  $("app").innerHTML = `

    <div class="loading">

      🔄 Buscando concurso atual...

      <br><br>

      🔄 Carregando 120 concursos...

    </div>

  `;


  try{

    const [
      latestRaw,
      historyRaw
    ] =
      await Promise.all([

        fetchJSON(
          API_LATEST
        ),

        fetchJSON(
          API_HISTORY
        )

      ]);


    const latest =
      normalizeDraw(
        latestRaw
      );


    const draws =
      (
        historyRaw.resultados
        || []
      )
      .map(
        normalizeDraw
      )
      .filter(Boolean)
      .sort(
        (a,b)=>
          b.concurso-a.concurso
      );


    if(!latest){

      throw new Error(
        "Último concurso inválido."
      );

    }


    if(!draws.length){

      throw new Error(
        "Histórico vazio."
      );

    }


    renderApp(
      latest,
      draws
    );


  }catch(error){

    console.error(
      "V25.9:",
      error
    );


    $("status").innerHTML = `

      🔴

      <span style="color:#ff747d">

        Erro ao carregar backend

      </span>

    `;


    $("app").innerHTML = `

      <div class="error">

        ❌ Não foi possível carregar
        os dados da Lotofácil.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>


      <section class="card">

        <button
          class="primary"
          style="width:100%"
          onclick="loadData()"
        >

          🔄 Tentar novamente

        </button>

      </section>

    `;

  }

}


/* ==========================================================
   START

document.addEventListener(
  "DOMContentLoaded",
  ()=>{
    loadData();
  }
);

</script>
