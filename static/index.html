const unique=a=>[...new Set(a)];
const gameKey=g=>[...g].sort((a,b)=>a-b).join("-");
const shuffle=arr=>{
 const a=[...arr];
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
};
function overlap(a,b){return a.filter(n=>b.includes(n)).length}

function isValidGame(g){
 return Array.isArray(g)&&g.length===GAME_SIZE&&
  unique(g).length===GAME_SIZE&&
  g.every(n=>Number.isInteger(n)&&n>=1&&n<=25);
}

function seededRandom(seed){
 let x=seed>>>0;
 return function(){
  x=(x+0x6D2B79F5)>>>0;
  let t=x;
  t=Math.imul(t^(t>>>15),t|1);
  t^=t+Math.imul(t^(t>>>7),t|61);
  return((t^(t>>>14))>>>0)/4294967296;
 };
}

function withSeed(seed,callback){
 const oldRandom=Math.random;
 Math.random=seededRandom(seed);
 try{return callback()}
 finally{Math.random=oldRandom}
}

function frequencyScore(data){
 const counts=Array(26).fill(0);
 data.forEach(d=>d.dezenas.forEach(n=>counts[n]++));
 const vals=counts.slice(1);
 const max=Math.max(...vals),min=Math.min(...vals);
 const range=Math.max(1,max-min),score={};
 for(let n=1;n<=25;n++)score[n]=(counts[n]-min)/range;
 return{score,counts};
}

function recencyScore(data){
 const score={};
 for(let n=1;n<=25;n++)score[n]=0;
 const recent=data.slice(-40);
 recent.forEach((d,i)=>d.dezenas.forEach(n=>{
  score[n]+=(i+1)/Math.max(1,recent.length);
 }));
 const max=Math.max(...Object.values(score));
 for(let n=1;n<=25;n++)score[n]=max?score[n]/max:0;
 return score;
}

function delayScore(data){
 const raw={},out={};
 for(let n=1;n<=25;n++){
  let d=0;
  for(let i=data.length-1;i>=0;i--){
   if(data[i].dezenas.includes(n))break;
   d++;
  }
  raw[n]=d;
 }
 const max=Math.max(...Object.values(raw));
 for(let n=1;n<=25;n++)out[n]=max?raw[n]/max:0;
 return out;
}

function cycleScore(data){
 const out={};
 for(let n=1;n<=25;n++){
  const positions=[];
  for(let i=0;i<data.length;i++){
   if(data[i].dezenas.includes(n))positions.push(i);
  }
  if(positions.length<2){out[n]=.5;continue}
  const gaps=[];
  for(let i=1;i<positions.length;i++)gaps.push(positions[i]-positions[i-1]);
  const avg=sum(gaps)/gaps.length;
  const currentGap=data.length-1-positions[positions.length-1];
  out[n]=1/(1+Math.abs(currentGap-avg));
 }
 return out;
}

function cooccurrenceScore(data){
 const pair=Array.from({length:26},()=>Array(26).fill(0));
 data.forEach(d=>{
  const a=d.dezenas;
  for(let i=0;i<a.length;i++){
   for(let j=i+1;j<a.length;j++){
    pair[a[i]][a[j]]++;
    pair[a[j]][a[i]]++;
   }
  }
 });
 const score={};
 for(let n=1;n<=25;n++)score[n]=sum(pair[n].slice(1));
 const max=Math.max(...Object.values(score));
 for(let n=1;n<=25;n++)score[n]=max?score[n]/max:0;
 return score;
}

function calculateRanking(data){
 const f=frequencyScore(data);
 const r=recencyScore(data);
 const d=delayScore(data);
 const c=cycleScore(data);
 const co=cooccurrenceScore(data);
 const out=[];
 for(let n=1;n<=25;n++){
  out.push({
   n,
   score:f.score[n]*.28+r[n]*.20+d[n]*.12+c[n]*.18+co[n]*.22,
   freq:f.score[n],recent:r[n],delay:d[n],cycle:c[n],co:co[n]
  });
 }
 return out.sort((a,b)=>b.score-a.score);
}

function buildNucleus(r){
 return{
  strong:r.slice(0,15).map(x=>x.n),
  protection:r.slice(15,20).map(x=>x.n),
  rotation:r.slice(20,25).map(x=>x.n)
 };
}

function gameStats(g){
 const even=g.filter(n=>n%2===0).length;
 let consecutive=0;
 for(let i=1;i<g.length;i++)if(g[i]===g[i-1]+1)consecutive++;
 const bands=[[1,5],[6,10],[11,15],[16,20],[21,25]]
  .map(([a,b])=>g.filter(n=>n>=a&&n<=b).length);
 return{even,odd:15-even,sum:sum(g),consecutive,distribution:bands};
}

function buildCandidate(n,profile){
 return unique([
  ...shuffle(n.strong).slice(0,profile.strong),
  ...shuffle(n.protection).slice(0,profile.protection),
  ...shuffle(n.rotation).slice(0,profile.rotation)
 ]);
}

function completeCandidate(candidate,r){
 const out=unique(candidate);
 const ranked=r.map(x=>x.n);
 for(const n of shuffle(ranked)){
  if(out.length>=GAME_SIZE)break;
  if(!out.includes(n))out.push(n);
 }
 return out.sort((a,b)=>a-b);
}

function rawGameScore(g,r){
 const scores=new Map(r.map(x=>[x.n,x.score]));
 return g.reduce((t,n)=>t+(scores.get(n)||0),0);
}

function bandPenalty(d,t){
 return d.reduce((p,v,i)=>p+Math.abs(v-t[i]),0);
}

function candidateScore(g,r,existing,p){
 const s=gameStats(g);
 let v=rawGameScore(g,r);
 if(s.even<p.evenMin)v-=(p.evenMin-s.even)*.2;
 if(s.even>p.evenMax)v-=(s.even-p.evenMax)*.2;
 if(s.sum<p.sumMin)v-=(p.sumMin-s.sum)*.018;
 if(s.sum>p.sumMax)v-=(s.sum-p.sumMax)*.018;
 if(s.consecutive>10)v-=(s.consecutive-10)*.15;
 v-=bandPenalty(s.distribution,p.targetBands)*.08;
 if(existing.length){
  v-=existing.reduce((t,e)=>t+overlap(g,e),0)/existing.length*.18;
 }
 return v;
}

function generateOneGame(n,r,existing,p,forbidden=new Set()){
 let best=null,bestScore=-Infinity;
 let bestFresh=null,freshScore=-Infinity;
 for(let i=0;i<500;i++){
  const g=completeCandidate(buildCandidate(n,p),r);
  if(!isValidGame(g))continue;
  const v=candidateScore(g,r,existing,p);
  const key=gameKey(g);
  if(v>bestScore){bestScore=v;best=g}
  if(!forbidden.has(key)&&v>freshScore){
   freshScore=v;
   bestFresh=g;
  }
 }
 return bestFresh||best;
}

/*
 V26.2:
 Não altera dezenas de jogos já formados para forçar cobertura.
 A cobertura é medida separadamente, sem invalidar apostas.
*/
function generateGames(n,r){
 const out=[],keys=new Set();
 for(let i=0;i<TOTAL_GAMES;i++){
  const g=generateOneGame(n,r,out,PROFILES[i],keys);
  if(!g||!isValidGame(g)||keys.has(gameKey(g)))continue;
  out.push(g);
  keys.add(gameKey(g));
 }
 return out;
}

function generateAdditionalGames(q){
 const requested=Math.max(1,Math.min(MAX_EXTRA_GAMES,Number(q)||1));
 const keys=new Set(games.map(gameKey));
 let added=0;
 for(let i=0;i<requested;i++){
  const p=EXTRA_PROFILES[(games.length-TOTAL_GAMES)%EXTRA_PROFILES.length];
  const g=generateOneGame(nucleus,ranking,games,p,keys);
  if(!g||!isValidGame(g)||keys.has(gameKey(g)))continue;
  games.push(g);
  keys.add(gameKey(g));
  added++;
 }
 return added;
}

function coverage(list){
 const nums=unique(list.flat());
 return{unique:nums.length,percent:Math.round(nums.length/25*100)};
}

function repetition(list){
 const vals=[];
 for(let i=0;i<list.length;i++){
  for(let j=i+1;j<list.length;j++)vals.push(overlap(list[i],list[j]));
 }
 return vals.length?sum(vals)/vals.length:0;
}

function getSaved(){

  const value=JSON.parse(localStorage.getItem(STORAGE_KEY));
  return Array.isArray(value)?value:[];
 }catch{return[]}
}

function saveGame(i){
 if(!games[i]||!latest)return;
 if(!isValidGame(games[i])){alert("Este jogo não passou na validação.");return}
 const a=getSaved();
 a.push({versao:VERSION,concurso:latest.concurso+1,jogo:i+1,dezenas:games[i],salvoEm:new Date().toISOString()});
 try{
  localStorage.setItem(STORAGE_KEY,JSON.stringify(a));
  alert(`Jogo ${i+1} salvo para o concurso ${latest.concurso+1}.`);
 }catch{alert("Não foi possível salvar neste dispositivo.")}
}

function saveAll(){
 if(!latest)return;
 const invalid=games.some(g=>!isValidGame(g));
 if(invalid){alert("Há jogo inválido. Gere novamente antes de salvar.");return}
 const a=getSaved();
 games.forEach((g,i)=>a.push({versao:VERSION,concurso:latest.concurso+1,jogo:i+1,dezenas:g,salvoEm:new Date().toISOString()}));

  localStorage.setItem(STORAGE_KEY,JSON.stringify(a));
  alert(`${games.length} jogos salvos para o concurso ${latest.concurso+1}.`);
 }catch{alert("Não foi possível salvar neste dispositivo.")}

  if(navigator.clipboard&&window.isSecureContext){
   await navigator.clipboard.writeText(t);
   return true;

 const a=document.createElement("textarea");

function randomGame(){
 return shuffle(Array.from({length:25},(_,i)=>i+1)).slice(0,15).sort((a,b)=>a-b);
}

function randomSix(){
 const out=[],keys=new Set();
 for(let attempts=0;out.length<6&&attempts<100;attempts++){
  const g=randomGame(),key=gameKey(g);
  if(isValidGame(g)&&!keys.has(key)){keys.add(key);out.push(g)}
 }
 return out;
}

function distributionHits(hits){
 const d={};
 for(let h=7;h<=15;h++)d[h]=0;
 hits.forEach(x=>{if(x>=7&&x<=15)d[x]++});
 return d;
}

/*
 Walk-forward reproduzível:
 - Treina somente com concursos anteriores ao concurso avaliado.
 - Compara seis jogos do modelo com seis jogos aleatórios.
 - Usa uma semente fixa por concurso para permitir repetir o teste.
 - O modelo continua sendo experimental; não prevê o sorteio.
*/
function walkForward(data){
 const start=Math.max(35,data.length-60),rows=[];
 for(let i=start;i<data.length;i++){
  const training=data.slice(0,i),actual=data[i].dezenas;
  if(training.length<30||!isValidGame(actual))continue;
  const seed=(Number(data[i].concurso)*2654435761)>>>0;
  const result=withSeed(seed,()=>{
   const localRanking=calculateRanking(training);
   const localNucleus=buildNucleus(localRanking);
   const modelGames=generateGames(localNucleus,localRanking);
   const baseGames=randomSix();
   const modelHits=modelGames.filter(isValidGame).map(g=>overlap(g,actual));
   const baseHits=baseGames.filter(isValidGame).map(g=>overlap(g,actual));
   if(!modelHits.length||!baseHits.length)return null;
   return{modelHits,baseHits};
  });
  if(!result)continue;
  const mh=result.modelHits,bh=result.baseHits;
  rows.push({
   concurso:data[i].concurso,
   modelMean:sum(mh)/mh.length,
   baseMean:sum(bh)/bh.length,
   modelBest:Math.max(...mh),
   baseBest:Math.max(...bh),
   modelPrizes:mh.filter(x=>x>=11).length,
   basePrizes:bh.filter(x=>x>=11).length,
   modelCount:mh.length,baseCount:bh.length,
   modelDist:distributionHits(mh),baseDist:distributionHits(bh)
  });
 }
 if(!rows.length)return{
  tests:0,modelMean:0,baseMean:0,meanDiff:0,modelBest:0,baseBest:0,bestDiff:0,
  modelPrizeRate:0,basePrizeRate:0,modelDist:{},baseDist:{},rows:[]
 };
 const modelCount=rows.reduce((t,r)=>t+r.modelCount,0);
 const baseCount=rows.reduce((t,r)=>t+r.baseCount,0);
 const modelMean=rows.reduce((t,r)=>t+r.modelMean,0)/rows.length;
 const baseMean=rows.reduce((t,r)=>t+r.baseMean,0)/rows.length;
 const modelBest=rows.reduce((t,r)=>t+r.modelBest,0)/rows.length;
 const baseBest=rows.reduce((t,r)=>t+r.baseBest,0)/rows.length;
 const modelDist={},baseDist={};
 for(let h=7;h<=15;h++){
  modelDist[h]=rows.reduce((t,r)=>t+r.modelDist[h],0);
  baseDist[h]=rows.reduce((t,r)=>t+r.baseDist[h],0);
 }
 return{
  tests:rows.length,modelMean,baseMean,meanDiff:modelMean-baseMean,
  modelBest,baseBest,bestDiff:modelBest-baseBest,
  modelPrizeRate:modelCount?rows.reduce((t,r)=>t+r.modelPrizes,0)/modelCount:0,
  basePrizeRate:baseCount?rows.reduce((t,r)=>t+r.basePrizes,0)/baseCount:0,
  modelDist,baseDist,rows
 };
}
