<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>Lotofácil Monitor V26.3</title>
<style>
:root{--bg:#080d18;--panel:#111a2b;--panel2:#172238;--line:#273650;--text:#f3f6ff;--muted:#9baac2;--green:#42e6a4;--blue:#62a8ff;--yellow:#ffd166;--red:#ff7185}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#172640 0,#080d18 60%);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1050px;margin:auto;padding:16px 13px 40px}
header{padding:20px 16px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#172743,#0e1626);margin-bottom:14px}
h1{font-size:24px;margin:0 0 6px;letter-spacing:-.5px}
h2{font-size:16px;margin:0 0 12px}
h3{font-size:14px;margin:0 0 9px}
p{line-height:1.5}
.sub,.muted{color:var(--muted)}
.sub{margin:0}
.pill{display:inline-block;border:1px solid var(--line);border-radius:30px;padding:5px 9px;font-size:11px;color:var(--green);margin:0 4px 8px 0}
.status{padding:10px 12px;border-radius:12px;background:#0d1727;border:1px solid var(--line);margin:12px 0;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.panel{background:linear-gradient(160deg,var(--panel),#0d1422);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:12px;min-width:0}
.full{grid-column:1/-1}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.stat{background:var(--panel2);padding:12px;border-radius:12px;border:1px solid var(--line)}
.stat b{display:block;font-size:21px;margin-top:5px}
.stat small{color:var(--muted)}
button,select,input,textarea{font:inherit}
button{border:0;border-radius:11px;padding:11px 13px;font-weight:700;background:var(--green);color:#06150f;cursor:pointer}
button.secondary{background:#24334d;color:var(--text);border:1px solid #3a4d6d}
button.blue{background:var(--blue);color:#07111e}
button:disabled{opacity:.55;cursor:wait}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions button{flex:1;min-width:110px}
.numbers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:12px 0}
.ball{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:#24344e
